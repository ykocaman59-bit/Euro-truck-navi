graphhopper:
  datareader.file: "turkey-latest.osm.pbf" # Veya europe-latest.osm.pbf
  graph.location: "graph-cache"
  import.osm.ignored_highways: ""
  
  profiles:
    # 1. AĞIR TIR PROFİLİ (40 Ton, 4M Yükseklik)
    - name: truck
      vehicle: truck
      weighting: custom
      custom_model:
        speed:
          - if: "true"
            limit_to: "80" # Tırlar için azami hız sınırı
        priority:
          # Tır erişimine kapalı yolları tamamen engelle
          - if: "hgv == NO"
            multiply_by: "0.0"
          - if: "access == NO"
            multiply_by: "0.0"
          # Yükseklik kısıtlamasını kontrol et
          - if: "max_height < 4.0"
            multiply_by: "0.0"
          # Ağırlık kısıtlamasını kontrol et
          - if: "max_weight < 40.0"
            multiply_by: "0.0"
          # Şehir içi dar sokakları ve konut alanlarını zorunlu kalmadıkça kullanma
          - if: "road_class == RESIDENTIAL"
            multiply_by: "0.05"
          - if: "road_class == LIVING_STREET"
            multiply_by: "0.0"

    # 2. KAMYONET PROFİLİ (3.5 Ton, 2.8M Yükseklik)
    - name: van
      vehicle: car
      weighting: custom
      custom_model:
        speed:
          - if: "true"
            limit_to: "90"
        priority:
          - if: "max_height < 2.8"
            multiply_by: "0.0"
          - if: "max_weight < 3.5"
            multiply_by: "0.0"
          - if: "access == NO"
            multiply_by: "0.0"

profiles_ch: []
profiles_lm: []

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
      
