<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIRNAV - Tırların Yol Arkadaşı</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; background: #0b132b; color: #fff; overflow: hidden; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Arayüz Katmanları */
        .ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .interactive { pointer-events: auto; }
        
        /* Ana Panel / Kartlar */
        .card { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; backdrop-filter: blur(10px); margin-bottom: 10px; }
        .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .logo-area h2 { font-size: 18px; color: #38bdf8; }
        .logo-area p { font-size: 11px; color: #94a3b8; }

        input, select { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff; margin-bottom: 10px; font-size: 14px; }
        .btn-primary { width: 100%; padding: 14px; background: #0284c7; border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; }
        
        /* Üst Navigasyon Paneli */
        .nav-top-panel { background: #0f172a; border-radius: 12px; padding: 12px; display: none; align-items: center; justify-content: space-between; border: 1px solid #334155; }
        
        /* Alt Navigasyon Çubuğu */
        .bottom-nav { display: flex; justify-content: space-around; background: #0f172a; padding: 10px 0; border-radius: 12px; border: 1px solid #334155; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 11px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: #38bdf8; }

        /* Uyarı Modalı */
        #alert-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .alert-box { background: #1e293b; border: 2px solid #ef4444; border-radius: 16px; padding: 20px; text-align: center; max-width: 350px; width: 100%; }
        .alert-box h3 { color: #ef4444; margin-bottom: 10px; font-size: 18px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-layer">
        <!-- Ana Menü / Arama Paneli -->
        <div class="card interactive" id="main-panel">
            <div class="logo-area">
                <div>
                    <h2>TIRNAV</h2>
                    <p>Tırların Yol Arkadaşı</p>
                </div>
            </div>
            <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 5px;">Mevcut Konum (GPS Canlı Nokta Atışı)</div>
            <input type="text" id="gps-status" value="Konum alınıyor, GPS bekleniyor..." readonly style="color: #38bdf8; font-weight: bold;">
            
            <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 5px;">Varış Noktası</div>
            <input type="text" id="destination-input" placeholder="Adres, şehir veya ülke girin (Örn: Ankara, İtalya)">
            
            <button class="btn-primary" onclick="createRoute()">Rota Oluştur</button>
        </div>

        <!-- Aktif Navigasyon Üst Bilgi -->
        <div class="nav-top-panel interactive" id="nav-panel">
            <div>
                <div style="font-size: 12px; color: #38bdf8;" id="nav-instruction">Otoyola bağlan</div>
                <div style="font-size: 14px; font-weight: bold;" id="nav-sub">Canlı Konum -> Rota Aktif</div>
            </div>
            <button onclick="stopNavigation()" style="background:#ef4444; border:none; color:#fff; padding:8px 12px; border-radius:6px; cursor:pointer;">Bitir</button>
        </div>

        <!-- Alt Sekmeler -->
        <div class="bottom-nav interactive">
            <div class="nav-item active" onclick="switchTab('home')">Ana Sayfa</div>
            <div class="nav-item" onclick="switchTab('map')">Harita</div>
            <div class="nav-item" onclick="switchTab('parks')">Parklar</div>
            <div class="nav-item" onclick="switchTab('fuel')">Yakıt</div>
            <div class="nav-item" onclick="switchTab('settings')">Ayarlar</div>
        </div>
    </div>

    <!-- Uyarı Modalı -->
    <div id="alert-modal">
        <div class="alert-box">
            <h3>⚠️ DİKKAT!</h3>
            <p id="alert-text" style="font-size: 14px; margin-bottom: 15px; color: #f8fafc;">4.00 m aracınız için yüksek! 3.80 m köprü var.</p>
            <button class="btn-primary" onclick="closeAlert()">Tamam</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Harita Başlatma (Leaflet Standart & Tır Optimizasyon Katmanı)
        const map = L.map('map', { zoomControl: false }).setView([41.0082, 28.9784], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = null;

        // GPS Konum Takibi ve Canlı Nokta Atışı
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                document.getElementById('gps-status').value = "Konum Aktif (GPS Bağlı)";
                
                if (!marker) {
                    marker = L.marker([lat, lon]).addTo(map).bindPopup("Tır Mevcut Konum").openPopup();
                } else {
                    marker.setLatLng([lat, lon]);
                }
                map.setView([lat, lon], 15);
            }, error => {
                document.getElementById('gps-status').value = "GPS Alınamadı, Manuel Başlatılıyor";
            }, { enableHighAccuracy: true });
        }

        function createRoute() {
            const dest = document.getElementById('destination-input').value;
            if(!dest) {
                alert("Lütfen bir varış noktası girin!");
                return;
            }
            
            // Yükseklik / Köprü Kontrol Simülasyonu (4.00m tır profili için)
            document.getElementById('alert-modal').style.display = 'flex';
            document.getElementById('main-panel').style.display = 'none';
            document.getElementById('nav-panel').style.display = 'flex';
        }

        function closeAlert() {
            document.getElementById('alert-modal').style.display = 'none';
        }

        function stopNavigation() {
            document.getElementById('nav-panel').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
        }

        function switchTab(tab) {
            alert(tab + " sekmesi aktif.");
        }
    </script>
</body>
</html>
