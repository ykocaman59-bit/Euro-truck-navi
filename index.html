<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tır & Kamyonet Navigasyonu</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #0f172a; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; z-index: 1; }

    /* ARAMA KUTUSU VE ÖNERİ LİSTESİ */
    #search-box {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 100;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .search-input-wrapper { display: flex; align-items: center; padding: 12px 14px; gap: 10px; }
    .search-input-wrapper input {
      flex: 1; border: none; outline: none; font-size: 0.95rem; color: #0f172a; background: transparent;
    }
    #search-results {
      background: #fff;
      border-radius: 0 0 12px 12px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      border-top: 1px solid #eee;
    }
    .search-item {
      padding: 11px 14px;
      font-size: 0.85rem;
      border-bottom: 1px solid #eee;
      color: #1e293b;
      cursor: pointer;
      line-height: 1.3;
    }
    .search-item:hover { background: #f1f5f9; }

    /* TIR PANELİ */
    #truck-panel {
      position: absolute;
      top: 68px;
      left: 12px;
      right: 12px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      z-index: 30;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .panel-header h3 { color: #38bdf8; font-size: 1rem; font-weight: 700; }
    .btn-toggle { background: #0284c7; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
    
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 0.72rem; color: #94a3b8; margin-bottom: 3px; }
    .form-group select, .form-group input {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.85rem; outline: none;
    }
    .btn-calc { width: 100%; background: #0284c7; color: white; padding: 12px; border: none; border-radius: 10px; margin-top: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }

    /* YOLCULUĞA BAŞLA BARI */
    #bottom-start-bar {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .route-summary-badge {
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-start-nav {
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
      cursor: pointer;
    }

    /* SÜRÜŞ BİLGİ KARTI */
    #active-nav-card {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      z-index: 45;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .instruction-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
    }
    .btn-stop-nav {
      width: 100%;
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="search-box">
    <div class="search-input-wrapper">
      <span>🔍</span>
      <input type="text" id="suggest-input" placeholder="Eren sokak no 7 Sultanbeyli veya dünya adresi..." oninput="handleSearch(this.value)">
    </div>
    <div id="search-results"></div>
  </div>

  <div id="truck-panel">
    <div class="panel-header">
      <h3>Tır Navigasyonu</h3>
      <button class="btn-toggle" onclick="togglePanel()">Kapat / Aç</button>
    </div>
    <div id="panel-content">
      <div class="form-group">
        <label>Araç Tipi</label>
        <select id="v_type">
          <option value="driving-hgv">Ağır Vasıta / TIR (40 T)</option>
          <option value="driving-car">Kamyonet / Otomobil</option>
        </select>
      </div>
      <div class="form-group">
        <label>Araç Yüksekliği (Metre)</label>
        <input type="number" id="v_height" value="4.20" step="0.1">
      </div>
      <div class="form-group">
        <label>Araç Ağırlığı (Ton)</label>
        <input type="number" id="v_weight" value="40">
      </div>
      <button class="btn-calc" onclick="calcHeiGITRoute()">HeiGIT Tır Rotası Hesapla</button>
    </div>
  </div>

  <div id="bottom-start-bar">
    <div class="route-summary-badge" id="route-summary-text">Mesafe: -- km | Tahmini Süre: -- dk</div>
    <button class="btn-start-nav" onclick="startNavigation()">▶ YOLCULUĞA BAŞLA</button>
  </div>

  <div id="active-nav-card">
    <div class="instruction-text" id="nav-instruction">Hazırlanıyor...</div>
    <button class="btn-stop-nav" onclick="stopNavigation()">Yolculuğu Bitir</button>
  </div>

  <script>
    // Aldığınız HeiGIT (OpenRouteService) API Key koda entegre edildi
    const HEIGIT_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImYzMTU3MGQ5YWU1NDQzYzRiYjBmZWNiYWYwNzAyZWZjIiwiaCI6Im11cm11cjY0In0=";

    let map, userMarker, targetMarker, routeLayer;
    let userCoords = null;
    let targetCoords = null;
    let watchId = null;

    window.onload = function() {
      // Harita Kurulumu (Yandex Görünümlü Kartografya)
      map = L.map('map', { zoomControl: false }).setView([40.9772, 29.2669], 13);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);

      // Konum Alma
      getGPSLocation();

      // Haritada Tıklayarak Varış Noktası Seçme
      map.on('click', (e) => {
        targetCoords = [e.latlng.lat, e.latlng.lng];
        setTargetMarker(targetCoords);
      });
    };

    function getGPSLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            map.setView(userCoords, 16);
            setUserMarker(userCoords);
          },
          (err) => {
            // Konum alınamazsa varsayılan Sultanbeyli merkez
            userCoords = [40.9772, 29.2669];
            setUserMarker(userCoords);
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else {
        userCoords = [40.9772, 29.2669];
        setUserMarker(userCoords);
      }
    }

    function setUserMarker(coords) {
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker(coords).addTo(map).bindPopup("Mevcut Konumunuz").openPopup();
    }

    function setTargetMarker(coords) {
      if (targetMarker) map.removeLayer(targetMarker);
      targetMarker = L.marker(coords).addTo(map).bindPopup("Varış Noktası").openPopup();
    }

    function togglePanel() {
      const content = document.getElementById('panel-content');
      content.style.display = content.style.display === 'none' ? 'block' : 'none';
    }

    // Yandex Altyapılı Hassas Adres / Kapı No Arama Motoru
    let searchTimeout;
    function handleSearch(query) {
      clearTimeout(searchTimeout);
      const resultsDiv = document.getElementById('search-results');
      if (query.length < 3) { resultsDiv.style.display = 'none'; return; }

      searchTimeout = setTimeout(async () => {
        try {
          // Yandex Geocoder Servis Sorgusu (Kapı no dahil dünya genelini tarar)
          const res = await fetch(`https://geocode-maps.yandex.ru/1.x/?format=json&geocode=${encodeURIComponent(query)}&lang=tr_TR`);
          const data = await res.json();
          const members = data.response.GeoObjectCollection.featureMember;
          
          resultsDiv.innerHTML = '';
          if (members && members.length > 0) {
            resultsDiv.style.display = 'block';
            members.forEach(item => {
              const geoObj = item.GeoObject;
              const coordsStr = geoObj.Point.pos.split(' '); // lon lat
              const lat = parseFloat(coordsStr[1]);
              const lon = parseFloat(coordsStr[0]);
              const addressText = geoObj.metaDataProperty.GeocoderMetaData.text;

              const div = document.createElement('div');
              div.className = 'search-item';
              div.innerText = addressText;
              div.onclick = () => {
                targetCoords = [lat, lon];
                setTargetMarker(targetCoords);
                map.setView(targetCoords, 16);
                resultsDiv.style.display = 'none';
                document.getElementById('suggest-input').value = addressText;
              };
              resultsDiv.appendChild(div);
            });
          }
        } catch (e) { console.error("Arama hatası:", e); }
      }, 350);
    }

    // HeiGIT (OpenRouteService) Tır Rota Hesaplama Entegrasyonu
    async function calcHeiGITRoute() {
      if (!userCoords) { alert("Konumunuz henüz alınamadı!"); return; }
      if (!targetCoords) { alert("Lütfen adresi yazıp listeden seçin veya haritadan tıklayın!"); return; }

      const profile = document.getElementById('v_type').value;
      const height = parseFloat(document.getElementById('v_height').value);
      const weight = parseFloat(document.getElementById('v_weight').value);

      const url = `https://api.openrouteservice.org/v2/directions/${profile}/geojson`;

      const requestBody = {
        coordinates: [
          [userCoords[1], userCoords[0]], // [lon, lat]
          [targetCoords[1], targetCoords[0]]
        ],
        options: {
          profile_params: {
            restrictions: {
              height: height,
              weight: weight
            }
          }
        }
      };

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Authorization': HEIGIT_API_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody)
        });

        const data = await res.json();

        if (data.features && data.features.length > 0) {
          if (routeLayer) map.removeLayer(routeLayer);

          routeLayer = L.geoJSON(data.features[0], {
            style: { color: '#0284c7', weight: 6, opacity: 0.9 }
          }).addTo(map);

          map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

          const summary = data.features[0].properties.summary;
          const distKm = (summary.distance / 1000).toFixed(1);
          const durMin = Math.round(summary.duration / 60);

          document.getElementById('route-summary-text').innerText = `Mesafe: ${distKm} km | Tahmini Süre: ${durMin} dk`;
          document.getElementById('bottom-start-bar').style.display = 'flex';
        } else {
          alert("Girdiğiniz tır ölçülerine göre uygun rota bulunamadı.");
        }
      } catch (e) {
        alert("Rota hesaplanırken bir hata oluştu. API anahtarını kontrol edin.");
      }
    }

    // Canlı Sürüş Navigasyonu
    function startNavigation() {
      document.getElementById('bottom-start-bar').style.display = 'none';
      document.getElementById('search-box').style.display = 'none';
      document.getElementById('truck-panel').style.display = 'none';
      document.getElementById('active-nav-card').style.display = 'flex';

      speak("Tır navigasyonu başlatılıyor. Güvenli sürüşler.");
      map.setZoom(18);

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition((pos) => {
          userCoords = [pos.coords.latitude, pos.coords.longitude];
          setUserMarker(userCoords);
          map.panTo(userCoords);
          document.getElementById('nav-instruction').innerText = "Tır rotası üzerinde ilerleyin";
        }, null, { enableHighAccuracy: true });
      }
    }

    function stopNavigation() {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      speak("Yolculuk sonlandırıldı.");

      document.getElementById('active-nav-card').style.display = 'none';
      document.getElementById('search-box').style.display = 'block';
      document.getElementById('truck-panel').style.display = 'block';

      if (routeLayer) map.removeLayer(routeLayer);
      map.setZoom(13);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'tr-TR';
        window.speechSynthesis.speak(msg);
      }
    }
  </script>
</body>
</html>
