<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIRNAV - Tırların Yol Arkadaşı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <style>
        body { background-color: #0b1329; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .screen { display: none; }
        .screen.active { display: flex; }
        #map { height: 100%; width: 100%; }
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <div class="flex-1 relative overflow-y-auto">
        <div id="screen-home" class="screen active flex-col p-4 h-full justify-between">
            <div>
                <div class="text-center my-4">
                    <h1 class="text-3xl font-extrabold text-blue-500 tracking-wider">TIRNAV</h1>
                    <p class="text-xs text-gray-400">Gerçek Konum & Yol Tarifi</p>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-xl">
                    <div class="flex items-center space-x-3 border-b border-slate-800 pb-3">
                        <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                        <div class="w-full">
                            <p class="text-xs text-gray-400">Mevcut Konum (GPS)</p>
                            <p id="gps-status-text" class="text-sm font-semibold text-white">Konumunuz algılanıyor...</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                        <div class="w-full">
                            <p class="text-xs text-gray-400">Nereye?</p>
                            <input type="text" id="destination-input" placeholder="Adres, şehir veya ülke yazın..." class="w-full bg-transparent text-sm focus:outline-none text-white placeholder-gray-500 mt-1">
                        </div>
                    </div>
                </div>

                <button onclick="startRealNavigation()" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2">
                    <span>Yol Tarifi & Başla</span>
                </button>
            </div>

            <div class="bg-slate-900/50 border border-slate-800 p-3 rounded-xl text-center text-xs text-gray-400">
                Telefonunuzun GPS konumu baz alınarak rota oluşturulur.
            </div>
        </div>

        <div id="screen-map" class="screen flex-col h-full relative">
            <div id="map" class="absolute inset-0 z-0"></div>
            
            <div class="absolute top-4 left-4 right-4 z-10 bg-slate-900/95 backdrop-blur border border-slate-700 p-3 rounded-2xl flex items-center justify-between shadow-2xl">
                <div class="flex items-center space-x-3">
                    <span class="bg-blue-600 p-2 rounded-xl text-lg">⬆️</span>
                    <div>
                        <p id="nav-step-info" class="text-sm font-bold">Yol Tarifi Aktif</p>
                        <p id="target-display" class="text-xs text-gray-400">Hedefe yönlendiriliyorsunuz...</p>
                    </div>
                </div>
                <button onclick="stopNavigation()" class="bg-red-600 text-xs px-3 py-1.5 rounded-lg font-bold text-white shadow">Çıkış</button>
            </div>

            <div class="absolute bottom-4 left-4 right-4 z-10 bg-slate-900/95 backdrop-blur border border-slate-700 p-4 rounded-2xl flex justify-between items-center shadow-2xl">
                <div>
                    <p id="stat-distance" class="text-lg font-black text-blue-400">-- km</p>
                    <p class="text-[10px] text-gray-400">Mesafe</p>
                </div>
                <div>
                    <p id="stat-duration" class="text-lg font-bold">-- sa -- dk</p>
                    <p class="text-[10px] text-gray-400">Tahmini Süre</p>
                </div>
                <div>
                    <p id="stat-arrival" class="text-lg font-bold">--:--</p>
                    <p class="text-[10px] text-gray-400">Varış Saati</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map, routingControl, userMarker;
        let currentLat = 40.9833, currentLng = 29.2833; // Varsayılan yedek konum (Sultanbeyli)
        let gpsAcquired = false;

        // Uygulama açıldığı an telefonun gerçek GPS konumunu arka planda yakala
        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(position => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    gpsAcquired = true;
                    document.getElementById('gps-status-text').innerText = "Gerçek Konumunuz Aktif (GPS)";
                    document.getElementById('gps-status-text').style.color = "#4ade80";
                }, error => {
                    document.getElementById('gps-status-text').innerText = "Konum izni bekleniyor / Sultanbeyli";
                }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
            }
        }

        window.onload = function() {
            initGPS();
        };

        function startRealNavigation() {
            let destQuery = document.getElementById('destination-input').value;
            if(!destQuery) {
                alert("Lütfen gitmek istediğiniz adresi veya şehri yazın!");
                return;
            }

            // Harita ekranına geç
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-map').classList.add('active');

            setTimeout(() => {
                if (!map) {
                    map = L.map('map').setView([currentLat, currentLng], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: 'TIRNAV'
                    }).addTo(map);
                } else {
                    map.invalidateSize();
                }

                // Hedef konumu Nominatim API ile koordinata çevir
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destQuery)}`)
                    .then(res => res.json())
                    .then(data => {
                        if(data && data.length > 0) {
                            let destLat = parseFloat(data[0].lat);
                            let destLng = parseFloat(data[0].lon);

                            if(routingControl) map.removeControl(routingControl);

                            // Gerçek rota çizgisini mevcut GPS konumundan hedefe çiz
                            routingControl = L.Routing.control({
                                waypoints: [
                                    L.latLng(currentLat, currentLng),
                                    L.latLng(destLat, destLng)
                                ],
                                routeWhileDragging: false,
                                createMarker: function(i, waypoint, n) {
                                    // Başlangıç ve bitiş noktalarına özel ikonlar koy
                                    return L.marker(waypoint.latLng);
                                },
                                addWaypoints: false
                            }).on('routesfound', function(e) {
                                let summary = e.routes[0].summary;
                                let km = (summary.totalDistance / 1000).toFixed(1);
                                let hours = Math.floor(summary.totalTime / 3600);
                                let minutes = Math.floor((summary.totalTime % 3600) / 60);

                                document.getElementById('stat-distance').innerText = km + " km";
                                document.getElementById('stat-duration').innerText = hours + " sa " + minutes + " dk";
                                
                                let arrivalDate = new Date(new Date().getTime() + summary.totalTime * 1000);
                                document.getElementById('stat-arrival').innerText = arrivalDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                document.getElementById('target-display').innerText = "Hedef: " + destQuery;
                            }).addTo(map);

                        } else {
                            alert("Aradığınız konum bulunamadı. Lütfen geçerli bir yer yazın.");
                            stopNavigation();
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        alert("Rota oluşturulurken bir hata oluştu.");
                        stopNavigation();
                    });

            }, 300);
        }

        function stopNavigation() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-home').classList.add('active');
        }
    </script>
</body>
</html>
