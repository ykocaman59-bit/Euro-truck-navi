<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIRNAV - Tırların Yol Arkadaşı</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; background: #0b132b; color: #fff; overflow: hidden; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Arayüz Katmanları */
        .ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .interactive { pointer-events: auto; }
        
        /* Ana Sayfa / Kart Tasarımı */
        .card { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container h2 { font-size: 22px; color: #38bdf8; margin-top: 5px; letter-spacing: 1px; }
        .logo-container p { font-size: 12px; color: #94a3b8; }

        label { font-size: 13px; color: #cbd5e1; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 14px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: #fff; margin-bottom: 15px; font-size: 15px; }
        .btn-primary { width: 100%; padding: 15px; background: #0284c7; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: #0369a1; }

        /* Rota Onay / Önizleme Alt Paneli */
        #preview-panel { display: none; position: absolute; bottom: 20px; left: 15px; right: 15px; z-index: 10; background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; border-radius: 16px; padding: 15px; }
        .btn-success { width: 100%; padding: 14px; background: #22c55e; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }

        /* Canlı Sürüş Üst Bilgi Paneli */
        #nav-top-panel { display: none; position: absolute; top: 15px; left: 15px; right: 15px; z-index: 10; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px 15px; align-items: center; justify-content: space-between; }
        
        /* Canlı Sürüş Alt Bilgi Paneli */
        #nav-bottom-panel { display: none; position: absolute; bottom: 20px; left: 15px; right: 15px; z-index: 10; background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; border-radius: 16px; padding: 15px; display: none; justify-content: space-between; align-items: center; }
        .speed-box { width: 75px; height: 75px; background: #0284c7; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid #38bdf8; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .info-group { text-align: center; }
        .info-group div:first-child { font-size: 15px; font-weight: bold; color: #fff; }
        .info-group div:last-child { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        .btn-danger { background: #ef4444; border: none; color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-layer">
        <!-- 1. ANA SAYFA EKRANI -->
        <div class="card interactive" id="main-panel">
            <div class="logo-container">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                <h2>TIRNAV</h2>
                <p>Tırların Yol Arkadaşı</p>
            </div>
            
            <label>Mevcut Konum</label>
            <input type="text" id="gps-status" value="Sultanbeyli / İstanbul" readonly style="color: #38bdf8; font-weight: 500;">
            
            <label>Varış Noktası</label>
            <input type="text" id="destination-input" placeholder="Adres, şehir veya ülke girin">
            
            <button class="btn-primary" onclick="showRoutePreview()">Rota Oluştur</button>
        </div>
    </div>

    <!-- 2. ROTA ÖNİZLEME / BAŞLANGIÇ PLANI -->
    <div class="interactive" id="preview-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-weight:bold; font-size:15px; color:#38bdf8;" id="preview-title">Hedef: Ankara</span>
            <button onclick="backToHome()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:13px;">✕ İptal</button>
        </div>
        <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 12px;">482 km | 5 sa 42 dk (TIR Rotalı)</div>
        <button class="btn-success" onclick="startNavigation()">YOLCULUĞA BAŞLA</button>
    </div>

    <!-- 3. CANLI SÜRÜŞ ÜST PANELİ -->
    <div class="interactive" id="nav-top-panel">
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="background:#0284c7; padding:8px; border-radius:8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
            <div>
                <div style="font-size: 13px; font-weight: bold; color: #fff;">1.2 km</div>
                <div style="font-size: 11px; color: #38bdf8;">Otoyola bağlanın (Sesli Asistan Aktif)</div>
            </div>
        </div>
        <button onclick="backToHome()" style="background:#1e293b; border:1px solid #334155; color:#38bdf8; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:bold;">Ana Menü</button>
    </div>

    <!-- 4. CANLI SÜRÜŞ ALT PANELİ -->
    <div class="interactive" id="nav-bottom-panel" style="display: none;">
        <div class="speed-box">
            <span style="font-size: 20px; font-weight: bold; color: #fff;" id="current-speed">0</span>
            <span style="font-size: 9px; color: #cbd5e1; font-weight: bold;">KM/S</span>
        </div>
        <div class="info-group">
            <div>482 km</div>
            <div>Kalan mesafe</div>
        </div>
        <div class="info-group">
            <div>5 sa 42 dk</div>
            <div>Tahmini süre</div>
        </div>
        <div class="info-group">
            <div>19:37</div>
            <div>Varış zamanı</div>
        </div>
        <button class="btn-danger" onclick="backToHome()">Bitir</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Harita Kurulumu
        const map = L.map('map', { zoomControl: false }).setView([40.9631, 29.2662], 13); // Sultanbeyli Merkez
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let routeLine = null;
        let userMarker = L.marker([40.9631, 29.2662]).addTo(map).bindPopup("Mevcut Konum: Sultanbeyli");

        function showRoutePreview() {
            const dest = document.getElementById('destination-input').value;
            if(!dest) {
                alert("Lütfen bir varış noktası girin!");
                return;
            }

            document.getElementById('preview-title').innerText = "Hedef: " + dest;
            document.getElementById('main-panel').style.display = 'none';
            document.getElementById('preview-panel').style.display = 'block';

            // Harita üzerinde örnek tır rotası çiz (Sultanbeyli -> Ankara koordinat simülasyonu)
            if (routeLine) map.removeLayer(routeLine);
            routeLine = L.polyline([
                [40.9631, 29.2662],
                [40.7654, 29.9403], // Kocaeli
                [40.7300, 30.3756], // Sakarya
                [39.9334, 32.8597]  // Ankara
            ], {color: '#0284c7', weight: 5, opacity: 0.8}).addTo(map);
            
            map.fitBounds(routeLine.getBounds(), {padding: [50, 50]});
        }

        function startNavigation() {
            document.getElementById('preview-panel').style.display = 'none';
            document.getElementById('nav-top-panel').style.display = 'flex';
            document.getElementById('nav-bottom-panel').style.display = 'flex';
        }

        function backToHome() {
            document.getElementById('preview-panel').style.display = 'none';
            document.getElementById('nav-top-panel').style.display = 'none';
            document.getElementById('nav-bottom-panel').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
            map.setView([40.9631, 29.2662], 13);
        }

        // GPS Canlı Konum Takibi (Simüle Edilmiş Hız Göstergesi ile)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const speedMs = position.coords.speed; // m/s
                
                if (speedMs !== null && speedMs >= 0) {
                    const speedKmh = Math.round(speedMs * 3.6);
                    document.getElementById('current-speed').innerText = speedKmh;
                }
                
                userMarker.setLatLng([lat, lon]);
            }, error => {}, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
