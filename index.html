<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIRNAV - Tırların Yol Arkadaşı</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-dark: #0b132b;
            --bg-card: #1c2541;
            --accent-blue: #0066ff;
            --accent-green: #2ecc71;
            --accent-red: #ff3333;
            --text-main: #ffffff;
            --text-secondary: #8d99ae;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .app-container { flex: 1; position: relative; width: 100%; height: calc(100vh - 70px); overflow: hidden; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; background: var(--bg-dark); overflow-y: auto; }
        .screen.active { display: flex; }

        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .top-nav-bar {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 1000;
            background: rgba(28, 37, 65, 0.95); padding: 10px 15px; border-radius: 12px;
            backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-back-home { background: var(--accent-blue); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .live-nav-card {
            position: absolute; top: 75px; left: 15px; right: 15px; z-index: 1000;
            background: rgba(28, 37, 65, 0.95); padding: 12px 16px; border-radius: 12px;
            backdrop-filter: blur(10px); display: none; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .live-nav-card.active { display: flex; }

        .trip-bottom-card {
            position: absolute; bottom: 20px; left: 15px; right: 15px; z-index: 1000;
            background: rgba(28, 37, 65, 0.95); padding: 15px; border-radius: 14px;
            backdrop-filter: blur(10px); text-align: center; border: 1px solid rgba(255,255,255,0.1); display: none;
        }
        .trip-bottom-card.active { display: block; }
        .trip-text { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 500; }
        
        .btn-start-trip { width: 100%; padding: 12px; background: var(--accent-green); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-end-trip { width: 100%; padding: 12px; background: var(--accent-red); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }

        .home-header { padding: 30px 20px; text-align: center; background: linear-gradient(180deg, #1c2541 0%, #0b132b 100%); }
        .home-header h1 { font-size: 28px; color: var(--text-main); margin-top: 10px; }
        .form-group { padding: 15px 20px; }
        .form-group label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .form-input { width: 100%; padding: 14px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-size: 16px; }
        .btn-primary { width: calc(100% - 40px); margin: 10px 20px; padding: 16px; background: var(--accent-blue); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }

        .bottom-nav {
            height: 70px; background: var(--bg-card); display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05); z-index: 1100; flex-shrink: 0;
        }
        .nav-item { background: none; border: none; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; font-size: 11px; cursor: pointer; gap: 4px; }
        .nav-item.active { color: var(--accent-blue); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. ANA SAYFA -->
    <div id="screen-home" class="screen active">
        <div class="home-header">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="#0066ff"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.62H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <h1>TIRNAV</h1>
            <p style="color: var(--text-secondary); font-size: 13px;">Tırların Yol Arkadaşı</p>
        </div>
        <div class="form-group">
            <label>Mevcut Konum</label>
            <input type="text" class="form-input" id="start-loc" value="Sultanbeyli / İstanbul">
        </div>
        <div class="form-group">
            <label>Varış Noktası</label>
            <input type="text" class="form-input" id="end-loc" placeholder="Adres, şehir veya ülke girin (Örn: İtalya)">
        </div>
        <button class="btn-primary" onclick="searchAndRoute()">Rota Oluştur</button>
    </div>

    <!-- 2. HARİTA EKRANI -->
    <div id="screen-map" class="screen">
        <div class="top-nav-bar">
            <span style="font-weight: bold; font-size: 14px;" id="topBarTitle">Tır Navigasyonu</span>
            <button class="btn-back-home" onclick="switchScreen('screen-home')">Ana Menü</button>
        </div>

        <div class="live-nav-card" id="liveNavCard">
            <div>
                <div style="font-size: 12px; color: var(--text-secondary);" id="liveRouteInfo">Sultanbeyli ➔ Hedef</div>
                <div style="font-weight: bold; font-size: 14px;" id="liveInstruction">Düz devam edin</div>
            </div>
            <div style="background: var(--accent-blue); padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 14px;" id="liveSpeed">0 km/s</div>
        </div>

        <div id="map"></div>

        <div class="trip-bottom-card" id="tripCard">
            <div class="trip-text" id="tripInfoText">Mesafe ve Süre hesaplanıyor...</div>
            <button class="btn-start-trip" id="tripActionBtn" onclick="toggleTripState()">YOLCULUĞA BAŞLA</button>
        </div>
    </div>

    <!-- 3. PARK / HİZMETLER -->
    <div id="screen-parks" class="screen" style="padding: 20px;">
        <h2 style="margin-bottom: 15px; font-size: 20px;">Tır Hizmet Noktaları</h2>
        <div style="background: var(--bg-card); padding: 15px; border-radius: 12px; margin-bottom: 10px;">
            <h4 style="color: var(--accent-blue); margin-bottom: 5px;">Kocaeli Tır Parkı</h4>
            <p style="font-size: 13px; color: var(--text-secondary);">12 km kaldı • 24 Saat Açık • ⭐ 4.6</p>
        </div>
    </div>

    <!-- 4. AYARLAR -->
    <div id="screen-settings" class="screen">
        <div style="padding: 20px; font-size: 20px; font-weight: bold;">Ayarlar</div>
        <div style="padding: 0 20px;">
            <div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><span>Navigasyon Sesleri</span><input type="checkbox" checked></div>
            <div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><span>Ağır Vasıta Köprü Filtresi</span><input type="checkbox" checked></div>
        </div>
    </div>
</div>

<!-- ALT MENÜ -->
<div class="bottom-nav">
    <button class="nav-item active" onclick="switchScreen('screen-home')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Ana Sayfa
    </button>
    <button class="nav-item" onclick="switchScreen('screen-map')">
        <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.1V5l6 2.1V19z"/></svg>Harita
    </button>
    <button class="nav-item" onclick="switchScreen('screen-parks')">
        <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z"/></svg>Parklar
    </button>
    <button class="nav-item" onclick="switchScreen('screen-settings')">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.47l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c-.5.38-1.03.7-1.62.94l-.36 2.54c-.05.24-.24.41-.48.41h3.84c.24 0 .44-.17.47-.47l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58z"/></svg>Ayarlar
    </button>
</div>

<script>
    let map = null;
    let routeLayer = null;
    let liveMarker = null;
    let watchId = null;
    let tripStarted = false;
    
    // Varsayılan Sultanbeyli Koordinatı
    const startCoord = [40.9833, 29.2662];

    window.addEventListener('DOMContentLoaded', () => {
        map = L.map('map', {zoomControl: false}).setView(startCoord, 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
    });

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        
        document.getElementById(screenId).classList.add('active');
        
        if(screenId === 'screen-home') document.querySelectorAll('.nav-item')[0].classList.add('active');
        if(screenId === 'screen-map') {
            document.querySelectorAll('.nav-item')[1].classList.add('active');
            if(map) setTimeout(() => map.invalidateSize(), 100);
        }
        if(screenId === 'screen-parks') document.querySelectorAll('.nav-item')[2].classList.add('active');
        if(screenId === 'screen-settings') document.querySelectorAll('.nav-item')[3].classList.add('active');
    }

    // Kullanıcının yazdığı şehri/ülkeyi Nominatim API ile bulup haritayı güncelleyen ana fonksiyon
    async function searchAndRoute() {
        const destQuery = document.getElementById('end-loc').value.trim();
        if(!destQuery) {
            alert("Lütfen bir varış noktası girin!");
            return;
        }

        switchScreen('screen-map');
        document.getElementById('tripInfoText').innerText = `${destQuery} için rota hesaplanıyor...`;

        try {
            // Açık kaynak harita arama motoru ile gerçek koordinat bulma
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destQuery)}`);
            const data = await response.json();

            let destCoord = [41.0082, 28.9784]; // Bulunamazsa varsayılan
            if(data && data.length > 0) {
                destCoord = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
            }

            setTimeout(() => {
                if(map) map.invalidateSize();

                if(routeLayer) map.removeLayer(routeLayer);
                
                // Başlangıç ve hedef arası çizgi
                const routeCoords = [startCoord, destCoord];
                routeLayer = L.polyline(routeCoords, {color: '#0066ff', weight: 6}).addTo(map);
                map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});

                document.getElementById('topBarTitle').innerText = `Sultanbeyli ➔ ${destQuery}`;
                document.getElementById('tripInfoText').innerText = `Hedef: ${destQuery} | Tır Rotası Aktif`;
                document.getElementById('tripCard').classList.add('active');
                
                tripStarted = false;
                const btn = document.getElementById('tripActionBtn');
                btn.innerText = "YOLCULUĞA BAŞLA";
                btn.className = "btn-start-trip";
            }, 150);

        } catch (e) {
            alert("Konum bulunamadı, varsayılan rota çiziliyor.");
        }
    }

    function toggleTripState() {
        const btn = document.getElementById('tripActionBtn');
        const liveCard = document.getElementById('liveNavCard');

        if(!tripStarted) {
            tripStarted = true;
            btn.innerText = "YOLCULUĞU BİTİR";
            btn.className = "btn-end-trip";
            liveCard.classList.add('active');

            // Gerçek zamanlı GPS Takibi
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(position => {
                    const latLng = [position.coords.latitude, position.coords.longitude];
                    const speedKmh = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;
                    
                    document.getElementById('liveSpeed').innerText = `${speedKmh} km/s`;

                    if (!liveMarker) {
                        liveMarker = L.marker(latLng, {
                            icon: L.divIcon({
                                className: 'live-icon',
                                html: '<div style="background:#2ecc71;width:22px;height:22px;border-radius:50%;border:3px solid white;box-shadow:0 0 12px rgba(0,0,0,0.6);"></div>',
                                iconSize: [22, 22]
                            })
                        }).addTo(map);
                    } else {
                        liveMarker.setLatLng(latLng);
                    }
                    map.setView(latLng, 15);
                }, err => {
                    console.log("GPS Hatası: ", err);
                }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
            } else {
                alert("Tarayıcınız GPS konum desteklemiyor.");
            }
        } else {
            tripStarted = false;
            btn.innerText = "YOLCULUĞA BAŞLA";
            btn.className = "btn-start-trip";
            document.getElementById('tripCard').classList.remove('active');
            liveCard.classList.remove('active');
            
            if(liveMarker) { map.removeLayer(liveMarker); liveMarker = null; }
            if(watchId) navigator.geolocation.clearWatch(watchId);
        }
    }
</script>
</body>
</html>
