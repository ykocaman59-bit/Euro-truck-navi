<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tır & Kamyonet Canlı Navigasyon</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #0f172a; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; z-index: 1; }

    /* ÜST ARAMA ÇUBUĞU VE ADRES ÖNERİ LİSTESİ */
    #search-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
    }
    .search-input-box {
      background: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      gap: 10px;
    }
    .search-input-box input {
      flex: 1; border: none; outline: none; font-size: 0.95rem; color: #0f172a;
    }
    #search-results {
      background: #ffffff;
      border-radius: 12px;
      margin-top: 6px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .search-item {
      padding: 12px 14px;
      font-size: 0.85rem;
      border-bottom: 1px solid #e2e8f0;
      color: #1e293b;
      cursor: pointer;
    }
    .search-item:hover { background: #f1f5f9; }

    /* TIR / AĞIR VASITA PARAMETRE KARTI */
    #truck-panel {
      position: absolute;
      top: 70px;
      left: 10px;
      right: 10px;
      z-index: 900;
      background: #1e293b;
      color: #ffffff;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 1.05rem;
      color: #38bdf8;
    }
    .btn-toggle {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.8rem; color: #94a3b8; }
    .form-group select, .form-group input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .btn-calc {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 4px;
    }

    /* ROTA BİLGİ KARTI VE YOLCULUĞA BAŞLA */
    #route-summary-card {
      position: absolute;
      bottom: 15px;
      left: 10px;
      right: 10px;
      z-index: 900;
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .route-info-text { font-size: 1rem; font-weight: 600; color: #e2e8f0; }
    .btn-start-nav {
      width: 100%;
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* SÜRÜŞ ESNASINDAKİ CANLI NAVİGASYON PANELİ */
    #active-nav-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1100;
      background: #1e293b;
      color: #fff;
      padding: 16px;
      border-radius: 14px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .nav-instruction { font-size: 1.1rem; font-weight: 700; color: #38bdf8; text-align: center; }
    .btn-stop-nav {
      width: 100%;
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="search-container">
    <div class="search-input-box">
      <span>🔍</span>
      <input id="search-input" type="text" placeholder="Adres veya kapı no yazın (ör: Eren Sokak No 7 Sultanbeyli)" oninput="searchAddress(this.value)">
    </div>
    <div id="search-results"></div>
  </div>

  <div id="truck-panel">
    <div class="panel-header">
      <span>Tır Navigasyonu</span>
      <button class="btn-toggle" onclick="togglePanel()">Kapat / Aç</button>
    </div>
    <div id="panel-content" style="display: flex; flex-direction: column; gap: 10px;">
      <div class="form-group">
        <label>Araç Tipi</label>
        <select id="vehicle-type">
          <option value="hgv">Ağır Vasıta / TIR (40 T)</option>
          <option value="bus">Otobüs</option>
          <option value="delivery">Kamyonet / Ticari</option>
        </select>
      </div>
      <div class="form-group">
        <label>Araç Yüksekliği (Metre)</label>
        <input type="number" id="truck-height" value="4.0" step="0.1">
      </div>
      <div class="form-group">
        <label>Araç Ağırlığı (Ton)</label>
        <input type="number" id="truck-weight" value="40">
      </div>
      <button class="btn-calc" onclick="calculateTruckRoute()">Yasakları Eleyleyerek Rota Hesapla</button>
    </div>
  </div>

  <div id="route-summary-card">
    <div class="route-info-text" id="route-details">Mesafe: -- km | Tahmini Süre: -- dk</div>
    <button class="btn-start-nav" onclick="startNavigation()">▶ YOLCULUĞA BAŞLA</button>
  </div>

  <div id="active-nav-panel">
    <div class="nav-instruction" id="nav-step-text">Canlı GPS Konumu Takip Ediliyor...</div>
    <button class="btn-stop-nav" onclick="stopNavigation()">Yolculuğu Bitir</button>
  </div>

  <script>
    let map, userMarker, targetMarker, routeLayer;
    let userCoords = null;
    let targetCoords = null;
    let watchId = null;
    let searchTimeout = null;
    let isPanelOpen = true;

    window.onload = function() {
      // 1. Haritayı Oluştur
      map = L.map('map', { zoomControl: false }).setView([41.0082, 28.9784], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // 2. Canlı GPS Takibini Başlat
      initGPSWatch();

      // 3. Haritaya Dokunarak Başlangıç/Bitiş Noktası Seçme
      map.on('click', (e) => {
        targetCoords = [e.latlng.lat, e.latlng.lng];
        setTargetMarker(targetCoords);
      });
    };

    // CANLI GPS KONUM TAKİBİ
    function initGPSWatch() {
      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];

            if (!userMarker) {
              // Başlangıç simgesi (Yeşil İkon)
              userMarker = L.circleMarker(userCoords, {
                radius: 10,
                fillColor: "#22c55e",
                color: "#ffffff",
                weight: 3,
                fillOpacity: 1
              }).addTo(map).bindPopup("Mevcut Konumunuz");
              
              map.setView(userCoords, 15);
            } else {
              userMarker.setLatLng(userCoords);
            }

            // Sürüş modunda harita aracı merkeze kilitler
            if (document.getElementById("active-nav-panel").style.display === "flex") {
              map.panTo(userCoords);
            }
          },
          (err) => console.warn("GPS Alınamadı:", err.message),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      }
    }

    // OTOMATİK ADRES / KAPINUMARASI ARAMASI (Nominatim)
    function searchAddress(query) {
      clearTimeout(searchTimeout);
      const resultsDiv = document.getElementById('search-results');
      if (query.length < 3) { resultsDiv.style.display = 'none'; return; }

      searchTimeout = setTimeout(async () => {
        try {
          // Türkiye öncelikli arama
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=tr&addressdetails=1&limit=5`);
          const data = await res.json();
          
          resultsDiv.innerHTML = '';
          if (data && data.length > 0) {
            resultsDiv.style.display = 'block';
            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'search-item';
              div.innerText = item.display_name;
              div.onclick = () => {
                targetCoords = [parseFloat(item.lat), parseFloat(item.lon)];
                setTargetMarker(targetCoords);
                map.setView(targetCoords, 16);
                resultsDiv.style.display = 'none';
                document.getElementById('search-input').value = item.display_name;
              };
              resultsDiv.appendChild(div);
            });
          }
        } catch (e) { console.error("Arama hatası:", e); }
      }, 350);
    }

    function setTargetMarker(coords) {
      if (targetMarker) map.removeLayer(targetMarker);
      // Bitiş Noktası (Kırmızı İkon)
      targetMarker = L.marker(coords).addTo(map).bindPopup("Varış Noktası").openPopup();
    }

    // TIR & AĞIR VASITA ROTA HESAPLAMA
    async function calculateTruckRoute() {
      if (!userCoords) { alert("GPS konumunuz bekleniyor. Konum iznini kontrol edin."); return; }
      if (!targetCoords) { alert("Lütfen haritadan veya aramadan bir varış noktası seçin."); return; }

      const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${targetCoords[1]},${targetCoords[0]}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes.length > 0) {
          if (routeLayer) map.removeLayer(routeLayer);

          const route = data.routes[0];
          routeLayer = L.geoJSON(route.geometry, {
            style: { color: '#0284c7', weight: 6, opacity: 0.9 }
          }).addTo(map);

          map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

          const distKm = (route.distance / 1000).toFixed(1);
          const durMin = Math.round(route.duration / 60);

          document.getElementById('route-details').innerText = `Mesafe: ${distKm} km | Tahmini Süre: ${durMin} dk`;
          document.getElementById('route-summary-card').style.display = 'flex';
          
          // Paneli küçült
          document.getElementById('panel-content').style.display = 'none';
          isPanelOpen = false;
        } else {
          alert("Rota oluşturulamadı.");
        }
      } catch (e) {
        alert("Rota sunucusuna bağlanılamadı.");
      }
    }

    // YOLCULUĞA BAŞLA VE SESLİ ASİSTAN
    function startNavigation() {
      document.getElementById('search-container').style.display = 'none';
      document.getElementById('truck-panel').style.display = 'none';
      document.getElementById('route-summary-card').style.display = 'none';
      document.getElementById('active-nav-panel').style.display = 'flex';

      speakText("Navigasyon başlatıldı. Rota üzerinde ilerleyin.");
      map.setZoom(18);
      if (userCoords) map.panTo(userCoords);
    }

    // YOLCULUĞU BİTİR
    function stopNavigation() {
      document.getElementById('active-nav-panel').style.display = 'none';
      document.getElementById('search-container').style.display = 'block';
      document.getElementById('truck-panel').style.display = 'flex';
      
      speakText("Yolculuk sonlandırıldı.");
      if (routeLayer) map.removeLayer(routeLayer);
      map.setZoom(13);
    }

    // SESLİ ASİSTAN
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'tr-TR';
        window.speechSynthesis.speak(msg);
      }
    }

    // PANEL AÇ/KAPAT
    function togglePanel() {
      const content = document.getElementById('panel-content');
      isPanelOpen = !isPanelOpen;
      content.style.display = isPanelOpen ? 'flex' : 'none';
    }
  </script>
</body>
</html>
