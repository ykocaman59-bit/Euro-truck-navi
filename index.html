<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canlı Takipli Navigasyon</title>

  <!-- Leaflet Harita Altyapısı (Tamamen Ücretsiz & Açık Kaynak) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #0f172a; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; z-index: 1; }

    /* ARAMA KUTUSU VE LİSTE */
    #search-box {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 100;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .search-input-wrapper { display: flex; align-items: center; padding: 12px 14px; gap: 10px; }
    .search-input-wrapper input {
      flex: 1; border: none; outline: none; font-size: 0.95rem; color: #0f172a; background: transparent;
    }
    #search-results {
      background: #fff;
      border-radius: 0 0 12px 12px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      border-top: 1px solid #eee;
    }
    .search-item {
      padding: 12px 14px;
      font-size: 0.85rem;
      border-bottom: 1px solid #eee;
      color: #1e293b;
      cursor: pointer;
      line-height: 1.3;
    }
    .search-item:hover { background: #f1f5f9; }

    /* ROTA BAŞLAT BARI */
    #bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .info-badge {
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .btn-start {
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
      cursor: pointer;
    }

    /* SÜRÜŞ / CANLI TAKİP BİLGİ PANELİ */
    #nav-active-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      padding: 16px;
      border-radius: 16px;
      z-index: 150;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .nav-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
    }
    .btn-stop {
      width: 100%;
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- ARAMA KUTUSU -->
  <div id="search-box">
    <div class="search-input-wrapper">
      <span>🔍</span>
      <input id="search-input" type="text" placeholder="Dünya genelinde il, ilçe, sokak veya kapı no yazın..." oninput="handleSearch(this.value)">
    </div>
    <div id="search-results"></div>
  </div>

  <!-- ROTA BAŞLAT PANELİ -->
  <div id="bottom-bar">
    <div class="info-badge" id="route-info">Mesafe: -- km | Süre: -- dk</div>
    <button class="btn-start" onclick="startLiveNavigation()">▶ NAVİGASYONU BAŞLAT</button>
  </div>

  <!-- CANLI SÜRÜŞ PANELİ -->
  <div id="nav-active-panel">
    <div class="nav-text" id="nav-instruction">Canlı konum takip ediliyor...</div>
    <button class="btn-stop" onclick="stopLiveNavigation()">Navigasyonu Bitir</button>
  </div>

  <script>
    let map, userMarker, targetMarker, routeLayer;
    let userCoords = null;
    let targetCoords = null;
    let watchId = null;
    let searchTimeout = null;

    window.onload = function() {
      // 1. Haritayı Kur (Sokaklar ve detaylar net görünsün)
      map = L.map('map', { zoomControl: false }).setView([41.0082, 28.9784], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // 2. Canlı Takibi Başlat
      initGPSWatch();

      // 3. Haritada Bir Yere Tıklayınca Nokta Koyma
      map.on('click', (e) => {
        targetCoords = [e.latlng.lat, e.latlng.lng];
        setTargetMarker(targetCoords);
        calculateRoute();
      });
    };

    // GERÇEK ZAMANLI CANLI GPS TAKİBİ (1'den 2'ye yürüdükçe mavi simge ve harita senle ilerler)
    function initGPSWatch() {
      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];

            // Mavi Canlı Konum Simgesi Oluştur veya Güncelle
            if (!userMarker) {
              userMarker = L.circleMarker(userCoords, {
                radius: 10,
                fillColor: "#0284c7",
                color: "#ffffff",
                weight: 3,
                opacity: 1,
                fillOpacity: 1
              }).addTo(map).bindPopup("Canlı Konumunuz");

              map.setView(userCoords, 16);
            } else {
              // Sen hareket ettikçe simgeyi yeni konuma kaydırır
              userMarker.setLatLng(userCoords);
            }

            // Navigasyon başladıysa haritayı sen yürüdükçe ortalar
            if (document.getElementById("nav-active-panel").style.display === "flex") {
              map.panTo(userCoords);
            }
          },
          (err) => {
            console.warn("GPS Hatası:", err.message);
          },
          {
            enableHighAccuracy: true, // Yüksek hassasiyetli GPS çipi
            maximumAge: 0,
            timeout: 5000
          }
        );
      } else {
        alert("Cihazınızda GPS desteği yok.");
      }
    }

    // KAPINUMARASINA KADAR TÜM DÜNYA ADRES ARAMASI
    function handleSearch(query) {
      clearTimeout(searchTimeout);
      const resultsDiv = document.getElementById('search-results');
      if (query.length < 3) { resultsDiv.style.display = 'none'; return; }

      searchTimeout = setTimeout(async () => {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=5`);
          const data = await res.json();
          
          resultsDiv.innerHTML = '';
          if (data && data.length > 0) {
            resultsDiv.style.display = 'block';
            data.forEach(item => {
              const lat = parseFloat(item.lat);
              const lon = parseFloat(item.lon);
              const addressText = item.display_name;

              const div = document.createElement('div');
              div.className = 'search-item';
              div.innerText = addressText;
              div.onclick = () => {
                targetCoords = [lat, lon];
                setTargetMarker(targetCoords);
                map.setView(targetCoords, 16);
                resultsDiv.style.display = 'none';
                document.getElementById('search-input').value = addressText;
                calculateRoute();
              };
              resultsDiv.appendChild(div);
            });
          }
        } catch (e) { console.error("Arama hatası:", e); }
      }, 350);
    }

    function setTargetMarker(coords) {
      if (targetMarker) map.removeLayer(targetMarker);
      targetMarker = L.marker(coords).addTo(map).bindPopup("Varış Noktası").openPopup();
    }

    // ÜCRETSİZ ROTA HESAPLAMA (OSRM Servisi)
    async function calculateRoute() {
      if (!userCoords) { alert("GPS konumunuz tespit ediliyor, birkaç saniye bekleyin."); return; }
      if (!targetCoords) return;

      const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${targetCoords[1]},${targetCoords[0]}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes.length > 0) {
          if (routeLayer) map.removeLayer(routeLayer);

          const route = data.routes[0];
          routeLayer = L.geoJSON(route.geometry, {
            style: { color: '#0284c7', weight: 6, opacity: 0.9 }
          }).addTo(map);

          map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

          const distKm = (route.distance / 1000).toFixed(1);
          const durMin = Math.round(route.duration / 60);

          document.getElementById('route-info').innerText = `Mesafe: ${distKm} km | Süre: ${durMin} dk`;
          document.getElementById('bottom-bar').style.display = 'flex';
        } else {
          alert("Rota bulunamadı.");
        }
      } catch (e) {
        alert("Rota sunucusuna bağlanırken hata oluştu.");
      }
    }

    // NAVİGASYON BAŞLAT / BİTİR
    function startLiveNavigation() {
      document.getElementById("search-box").style.display = "none";
      document.getElementById("bottom-bar").style.display = "none";
      document.getElementById("nav-active-panel").style.display = "flex";

      speak("Navigasyon başlatıldı. Güvenli sürüşler.");

      map.setZoom(18);
      if (userCoords) map.panTo(userCoords);
    }

    function stopLiveNavigation() {
      document.getElementById("nav-active-panel").style.display = "none";
      document.getElementById("search-box").style.display = "block";
      
      speak("Yolculuk sonlandırıldı.");
      if (routeLayer) map.removeLayer(routeLayer);
      map.setZoom(14);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'tr-TR';
        window.speechSynthesis.speak(msg);
      }
    }
  </script>
</body>
</html>
