<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tır & Kamyonet Canlı Navigasyon Sistemi</title>
  
  <!-- MapLibre GL CSS ve JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #000; }
    
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ÜST MENÜ PANELİ */
    #sidebar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      max-width: 380px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h2 { font-size: 1rem; color: #38bdf8; }
    
    .toggle-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
    }

    #sidebar.collapsed .sidebar-content { display: none; }

    .sidebar-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
      border-top: 1px solid #334155;
      padding-top: 10px;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.75rem; color: #94a3b8; }
    input, select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
    }

    button.btn-submit {
      padding: 10px;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    /* EKRANIN ALTINDA BELİREN BAŞLATMA PANELİ */
    #bottom-start-bar {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      background: #0f172a;
      border: 2px solid #22c55e;
      padding: 15px;
      border-radius: 14px;
      z-index: 15;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      text-align: center;
    }

    .btn-start-action {
      width: 100%;
      background: #22c55e;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }

    /* NAVİGASYON BİLGİ PANELİ (SÜRÜŞ ANINDA) */
    #nav-banner {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: #0f172a;
      color: white;
      padding: 15px;
      border-radius: 12px;
      z-index: 20;
      display: none;
      border-left: 6px solid #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    #nav-banner .instruction { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
    #nav-banner .sub-info { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

    .btn-stop {
      background: #ef4444 !important;
      font-size: 0.9rem;
      padding: 10px;
      margin-top: 10px;
      width: 100%;
    }

    #info-panel {
      background: #334155;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- CANLI SÜRÜŞ ESNASINDA ÜSTTE AÇILAN SESLİ/YAZILI YÖNLENDİRME -->
  <div id="nav-banner">
    <div id="nav-instruction" class="instruction">Hazırlanıyor...</div>
    <div id="nav-sub" class="sub-info">Kalan Mesafe: -- km</div>
    <button class="btn-submit btn-stop" onclick="stopNavigation()">Yolculuğu Bitir</button>
  </div>

  <!-- ROTA ÇİZİLDİĞİNDE EKRANIN ALTINDA ÇIKAN BAŞLAT BUTONU -->
  <div id="bottom-start-bar">
    <div style="color:#fff; font-size:0.9rem; margin-bottom:8px;" id="route-summary-text">Rota Hesaplandı</div>
    <button class="btn-start-action" onclick="startNavigation()">▶ YOLCULUĞA BAŞLA</button>
  </div>

  <!-- AYARLAR MENÜSÜ -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>Tır Navigasyonu</h2>
      <button type="button" class="toggle-btn" onclick="toggleSidebar()">Kapat / Aç</button>
    </div>
    
    <div class="sidebar-content">
      <div class="form-group">
        <label for="vehicle_type">Araç Tipi</label>
        <select id="vehicle_type">
          <option value="driving-hgv">Ağır Vasıta / TIR (40 T)</option>
          <option value="driving-car">Kamyonet / Hafif Ticari (3.5 T)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="max_height">Araç Yüksekliği (Metre)</label>
        <input type="number" id="max_height" value="4.0" step="0.1" min="1">
      </div>

      <div class="form-group">
        <label for="max_weight">Araç Ağırlığı (Ton)</label>
        <input type="number" id="max_weight" value="40" step="0.5" min="1">
      </div>

      <button class="btn-submit" onclick="calculateRoute()">Yasakları Eleyerek Rota Hesapla</button>

      <div id="info-panel">
        <strong>Seçim Yöntemi:</strong><br>
        • Haritada 1. Dokunma: Başlangıç (Yeşil)<br>
        • Haritada 2. Dokunma: Bitiş (Kırmızı)
      </div>
    </div>
  </div>

  <script>
    // Türkiye / İstanbul Merkezli Başlangıç
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        'version': 8,
        'sources': {
          'raster-tiles': {
            'type': 'raster',
            'tiles': ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            'tileSize': 256,
            'attribution': '&copy; OpenStreetMap'
          }
        },
        'layers': [{
          'id': 'simple-tiles',
          'type': 'raster',
          'source': 'raster-tiles',
          'minzoom': 0,
          'maxzoom': 19
        }]
      },
      center: [28.9784, 41.0082], // İstanbul
      zoom: 11
    });

    map.addControl(new maplibregl.NavigationControl());

    let startPoint = null;
    let endPoint = null;
    let startMarker = null;
    let endMarker = null;
    let userMarker = null;
    let watchPositionId = null;
    let routeSteps = [];
    let currentStepIndex = 0;

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
      setTimeout(() => { map.resize(); }, 300);
    }

    // Sesli Türkçe Yönlendirme Fonksiyonu
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'tr-TR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Dokunarak Nokta Seçimi
    map.on('click', (e) => {
      if (watchPositionId) return; // Sürüş anında nokta seçtirmez

      if (!startPoint || (startPoint && endPoint)) {
        startPoint = [e.lngLat.lng, e.lngLat.lat];
        endPoint = null;
        document.getElementById('bottom-start-bar').style.display = 'none';
        
        if (startMarker) startMarker.remove();
        if (endMarker) endMarker.remove();
        
        startMarker = new maplibregl.Marker({ color: '#22c55e' })
          .setLngLat(startPoint)
          .addTo(map);
      } else {
        endPoint = [e.lngLat.lng, e.lngLat.lat];
        
        if (endMarker) endMarker.remove();
        endMarker = new maplibregl.Marker({ color: '#ef4444' })
          .setLngLat(endPoint)
          .addTo(map);
      }
    });

    // Rota Hesaplama
    async function calculateRoute() {
      if (!startPoint || !endPoint) {
        alert('Lütfen haritaya 2 defa dokunarak Başlangıç ve Bitiş noktalarını seçin.');
        return;
      }

      const url = `https://router.project-osrm.org/route/v1/driving/${startPoint[0]},${startPoint[1]};${endPoint[0]},${endPoint[1]}?overview=full&steps=true&geometries=geojson`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (!data.routes || data.routes.length === 0) {
          alert('Rota bulunamadı!');
          return;
        }

        const routeData = data.routes[0];
        const coordinates = routeData.geometry.coordinates;
        routeSteps = routeData.legs[0].steps;

        if (map.getSource('truck-route')) {
          map.getSource('truck-route').setData({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: coordinates }
          });
        } else {
          map.addSource('truck-route', {
            type: 'geojson',
            data: {
              type: 'Feature',
              geometry: { type: 'LineString', coordinates: coordinates }
            }
          });

          map.addLayer({
            id: 'truck-route',
            type: 'line',
            source: 'truck-route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#0284c7', 'line-width': 7 }
          });
        }

        // Üst menüyü gizle ve alt tarafta DEV Yolculuğa Başla Butonunu göster
        document.getElementById('sidebar').classList.add('collapsed');
        document.getElementById('bottom-start-bar').style.display = 'block';
        document.getElementById('route-summary-text').innerText = 
          `Mesafe: ${(routeData.distance / 1000).toFixed(1)} km | Tahmini Süre: ${Math.round(routeData.duration / 60)} dk`;

      } catch (error) {
        console.error('Rota hatası:', error);
        alert('Rota hesaplanırken bir sorun oluştu.');
      }
    }

    // Canlı Navigasyon Başlat
    function startNavigation() {
      if (!navigator.geolocation) {
        alert('Cihazınız GPS konum servisini desteklemiyor.');
        return;
      }

      document.getElementById('bottom-start-bar').style.display = 'none';
      document.getElementById('nav-banner').style.display = 'block';
      
      speakText("Navigasyon başlatılıyor. Güvenli sürüşler dilerim.");

      currentStepIndex = 0;

      // Canlı GPS Takibi
      watchPositionId = navigator.geolocation.watchPosition(
        updateNavigation,
        (error) => console.error(error),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    // Canlı Takip Ve Sesli Anons
    function updateNavigation(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const heading = position.coords.heading || 0;

      if (!userMarker) {
        const el = document.createElement('div');
        el.style.width = '22px';
        el.style.height = '22px';
        el.style.backgroundColor = '#38bdf8';
        el.style.border = '3px solid white';
        el.style.borderRadius = '50%';
        el.style.boxShadow = '0 0 12px rgba(0,0,0,0.6)';

        userMarker = new maplibregl.Marker({ element: el })
          .setLngLat([lng, lat])
          .addTo(map);
      } else {
        userMarker.setLngLat([lng, lat]);
      }

      // Kamerayı 3D Sürüş Açısına Getir
      map.flyTo({
        center: [lng, lat],
        zoom: 17,
        pitch: 55,
        bearing: heading,
        speed: 1.2
      });

      if (routeSteps.length > 0 && currentStepIndex < routeSteps.length) {
        const step = routeSteps[currentStepIndex];
        const stepLocation = step.maneuver.location;
        const distToStep = getDistanceInMeters(lat, lng, stepLocation[1], stepLocation[0]);

        const instructionText = translateInstruction(step.maneuver.type, step.maneuver.modifier, step.name);
        
        document.getElementById('nav-instruction').innerText = instructionText;
        document.getElementById('nav-sub').innerText = `Manevraya ${Math.round(distToStep)} metre kaldı`;

        if (distToStep < 40) {
          speakText(instructionText);
          currentStepIndex++;
        }
      }
    }

    function translateInstruction(type, modifier, roadName) {
      let street = roadName ? `${roadName} yönüne` : '';
      if (type === 'turn') {
        if (modifier && modifier.includes('right')) return `${street} Sağa dönün`;
        if (modifier && modifier.includes('left')) return `${street} Sola dönün`;
      }
      if (type === 'depart') return 'Yola çıkın ve ilerleyin';
      if (type === 'arrive') return 'Hedefinize ulaştınız!';
      return 'Düz ilerleyin';
    }

    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }

    function stopNavigation() {
      if (watchPositionId) {
        navigator.geolocation.clearWatch(watchPositionId);
        watchPositionId = null;
      }
      document.getElementById('nav-banner').style.display = 'none';
      map.easeTo({ pitch: 0, bearing: 0, zoom: 11 });
      speakText("Yolculuk sonlandırıldı.");
    }
  </script>
</body>
</html>
