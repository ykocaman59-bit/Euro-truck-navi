<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tır & Kamyonet Profesyonel Navigasyon Sistemi</title>
  
  <!-- MapLibre GL CSS ve JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    
    /* TAM EKRAN HARİTA */
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* MOBİL UYUMLU ÜST YÜZEN MENÜ */
    #sidebar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      max-width: 380px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h2 { font-size: 1rem; color: #38bdf8; }
    
    .toggle-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
    }

    /* Menü Gizlendiğinde İçeriği Sakla */
    #sidebar.collapsed .sidebar-content {
      display: none;
    }

    .sidebar-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
      border-top: 1px solid #334155;
      padding-top: 10px;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.75rem; color: #94a3b8; }
    input, select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
    }

    button.btn-submit {
      padding: 10px;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 5px;
    }

    #info-panel {
      background: #334155;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      line-height: 1.3;
    }

    #route-details {
      background: #0f172a;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- HARİTA -->
  <div id="map"></div>

  <!-- ÜST MENÜ PANELİ (Varsayılan Olarak Gizli Başlar) -->
  <div id="sidebar" class="collapsed">
    <div class="sidebar-header">
      <h2>Tır Navigasyonu</h2>
      <button type="button" class="toggle-btn" onclick="toggleSidebar()">Ayarlar / Menü</button>
    </div>
    
    <div class="sidebar-content">
      <div class="form-group">
        <label for="vehicle_type">Araç Tipi</label>
        <select id="vehicle_type" onchange="updateVehicleDefaults()">
          <option value="truck">Ağır Vasıta / TIR (40 T)</option>
          <option value="van">Kamyonet / Hafif Ticari (3.5 T)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="max_height">Araç Yüksekliği (Metre)</label>
        <input type="number" id="max_height" value="4.0" step="0.1" min="1">
      </div>

      <div class="form-group">
        <label for="max_weight">Araç Ağırlığı (Ton)</label>
        <input type="number" id="max_weight" value="40" step="0.5" min="1">
      </div>

      <button class="btn-submit" onclick="calculateRoute()">Yasakları Eleyerek Rota Hesapla</button>

      <div id="info-panel">
        <strong>Seçim Yöntemi:</strong><br>
        • Haritada 1. Dokunma: Başlangıç (Yeşil)<br>
        • Haritada 2. Dokunma: Bitiş (Kırmızı)
      </div>

      <div id="route-details" style="display:none;">
        <strong style="color:#38bdf8;">Rota Detayı:</strong>
        <p id="route-distance"></p>
        <p id="route-time"></p>
      </div>
    </div>
  </div>

  <script>
    // Garantili Yüklenen OpenStreetMap Tile Stili
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        'version': 8,
        'sources': {
          'raster-tiles': {
            'type': 'raster',
            'tiles': ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            'tileSize': 256,
            'attribution': '&copy; OpenStreetMap'
          }
        },
        'layers': [{
          'id': 'simple-tiles',
          'type': 'raster',
          'source': 'raster-tiles',
          'minzoom': 0,
          'maxzoom': 19
        }]
      },
      center: [28.9784, 41.0082], // İstanbul
      zoom: 10
    });

    // Yakınlaştırma/Uzaklaştırma Kontrolleri
    map.addControl(new maplibregl.NavigationControl());

    let startPoint = null;
    let endPoint = null;
    let startMarker = null;
    let endMarker = null;

    // Menüyü Açma / Kapama
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
      setTimeout(() => { map.resize(); }, 300);
    }

    function updateVehicleDefaults() {
      const type = document.getElementById('vehicle_type').value;
      if (type === 'truck') {
        document.getElementById('max_height').value = "4.0";
        document.getElementById('max_weight').value = "40";
      } else {
        document.getElementById('max_height').value = "2.8";
        document.getElementById('max_weight').value = "3.5";
      }
    }

    // Dokunarak Nokta Seçme Logic (Mobilde 1. Dokunma Başlangıç, 2. Dokunma Bitiş)
    map.on('click', (e) => {
      if (!startPoint || (startPoint && endPoint)) {
        // İlk dokunma veya sıfırlama: Başlangıç
        startPoint = [e.lngLat.lng, e.lngLat.lat];
        endPoint = null;
        
        if (startMarker) startMarker.remove();
        if (endMarker) endMarker.remove();
        
        startMarker = new maplibregl.Marker({ color: '#22c55e' })
          .setLngLat(startPoint)
          .addTo(map);
      } else {
        // İkinci dokunma: Bitiş
        endPoint = [e.lngLat.lng, e.lngLat.lat];
        
        if (endMarker) endMarker.remove();
        endMarker = new maplibregl.Marker({ color: '#ef4444' })
          .setLngLat(endPoint)
          .addTo(map);
      }
    });

    async function calculateRoute() {
      if (!startPoint || !endPoint) {
        alert('Lütfen haritaya iki defa dokunarak Başlangıç ve Bitiş noktalarını seçin.');
        return;
      }

      const profile = document.getElementById('vehicle_type').value;
      const height = document.getElementById('max_height').value;
      const weight = document.getElementById('max_weight').value;

      const url = `http://localhost:8989/route?` +
        `point=${startPoint[1]},${startPoint[0]}&` +
        `point=${endPoint[1]},${endPoint[0]}&` +
        `profile=${profile}&` +
        `custom_model.max_height=${height}&` +
        `custom_model.max_weight=${weight}&` +
        `type=json&points_encoded=false`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (!data.paths || data.paths.length === 0) {
          alert('Girilen araç ölçülerine uygun yasal bir rota bulunamadı!');
          return;
        }

        const routeData = data.paths[0];
        const coordinates = routeData.points.coordinates;

        if (map.getSource('truck-route')) {
          map.getSource('truck-route').setData({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: coordinates }
          });
        } else {
          map.addSource('truck-route', {
            type: 'geojson',
            data: {
              type: 'Feature',
              geometry: { type: 'LineString', coordinates: coordinates }
            }
          });

          map.addLayer({
            id: 'truck-route',
            type: 'line',
            source: 'truck-route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#0284c7', 'line-width': 6 }
          });
        }

        document.getElementById('route-details').style.display = 'block';
        document.getElementById('route-distance').innerText = `Mesafe: ${(routeData.distance / 1000).toFixed(1)} km`;
        document.getElementById('route-time').innerText = `Tahmini Süre: ${Math.round(routeData.time / 60000)} dk`;

        // Rota çizilince menüyü kapat ki harita görünsün
        const sidebar = document.getElementById('sidebar');
        if (!sidebar.classList.contains('collapsed')) {
          toggleSidebar();
        }

      } catch (error) {
        console.error('Rota hesaplama hatası:', error);
        alert('GraphHopper sunucusuna bağlanılamadı. Lütfen sunucunun çalıştığından emin olun.');
      }
    }
  </script>
</body>
</html>
