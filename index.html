<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profesyonel Tır Navigasyonu</title>
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #111; }
    
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; z-index: 1; }

    /* SOL ÜST MANEVRA TABELASI (YANDEX/GOOGLE STİLİ) */
    #turn-banner {
      position: absolute;
      top: 15px;
      left: 15px;
      width: calc(100% - 150px);
      max-width: 320px;
      background: #1a73e8;
      color: white;
      padding: 12px 16px;
      border-radius: 16px;
      z-index: 20;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .turn-distance { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
    .turn-street { font-size: 0.95rem; font-weight: 500; opacity: 0.9; margin-top: 2px; }
    .next-turn { font-size: 0.75rem; opacity: 0.8; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 4px; }

    /* SAĞ ÜST HIZ GÖSTERGELERİ */
    #speed-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      display: none;
      flex-direction: row;
      gap: 10px;
      z-index: 20;
    }
    .speed-box {
      width: 52px;
      height: 52px;
      background: white;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      font-weight: 800;
    }
    .current-speed { color: #000; font-size: 1.2rem; }
    .speed-limit { border: 4px solid #d93025; color: #000; font-size: 1.1rem; }

    /* ALT VARIŞ VE BİLGİ PANELİ */
    #bottom-nav-bar {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 28px;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .nav-stats { display: flex; gap: 15px; align-items: baseline; }
    .stat-dist { font-size: 1.2rem; font-weight: 800; color: #202124; }
    .stat-time { font-size: 1.2rem; font-weight: 800; color: #188038; }
    .stat-eta { font-size: 0.9rem; color: #5f6368; font-weight: 600; }
    .btn-close-nav {
      background: #f1f3f4;
      color: #3c4043;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
    }

    /* KURULUM VE AYAR PANELİ */
    #setup-card {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      background: #1e293b;
      color: white;
      padding: 16px;
      border-radius: 16px;
      z-index: 20;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .form-row { display: flex; gap: 10px; margin-top: 10px; }
    input, select {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
    }
    .btn-main {
      width: 100%;
      background: #10b981;
      color: white;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    /* 3D NAVİGASYON OKU */
    .truck-arrow {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 24px solid #f59e0b;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
      transition: transform 0.2s ease;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- MANEVRA TABELASI -->
  <div id="turn-banner">
    <div id="turn-dist" class="turn-distance">0 m</div>
    <div id="turn-street" class="turn-street">İlerleyin</div>
    <div id="next-turn" class="next-turn">sonra --</div>
  </div>

  <!-- HIZ PANELİ -->
  <div id="speed-panel">
    <div class="speed-box"><span id="curr-speed" class="current-speed">0</span></div>
    <div class="speed-box speed-limit"><span>50</span></div>
  </div>

  <!-- ALT CANLI SÜRÜŞ BİLGİSİ -->
  <div id="bottom-nav-bar">
    <div class="nav-stats">
      <span id="nav-dist" class="stat-dist">0 km</span>
      <span id="nav-eta" class="stat-eta">00:00</span>
      <span id="nav-time" class="stat-time">0 dk</span>
    </div>
    <button class="btn-close-nav" onclick="stopNavigation()">✕</button>
  </div>

  <!-- BAŞLANGIÇ AYAR KARTI -->
  <div id="setup-card">
    <h3 style="font-size:1rem; color:#38bdf8;">Tır Yasaklı Rota Hesaplayıcı</h3>
    <div class="form-row">
      <select id="v_type">
        <option value="driving-hgv">Ağır Vasıta / TIR</option>
        <option value="driving-car">Kamyonet / Otomobil</option>
      </select>
      <input type="number" id="v_height" value="4.0" placeholder="Yükseklik (m)" step="0.1">
      <input type="number" id="v_weight" value="40" placeholder="Ağırlık (T)" step="1">
    </div>
    <button class="btn-main" onclick="calculateTruckRoute()">Tır Rotası Oluştur</button>
    <button id="btn-start" class="btn-main" style="background:#2563eb; display:none;" onclick="startNavigation()">▶ Navigasyonu Başlat</button>
  </div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        'version': 8,
        'sources': {
          'raster-tiles': {
            'type': 'raster',
            'tiles': ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            'tileSize': 256
          }
        },
        'layers': [{'id': 'simple-tiles', 'type': 'raster', 'source': 'raster-tiles'}]
      },
      center: [28.9784, 41.0082],
      zoom: 13
    });

    let startPoint = null, endPoint = null;
    let startMarker = null, endMarker = null, userMarker = null;
    let watchId = null, routeSteps = [], currentStepIndex = 0;

    // Haritadan Başlangıç/Bitiş Seçimi
    map.on('click', (e) => {
      if (watchId) return;
      if (!startPoint || (startPoint && endPoint)) {
        startPoint = [e.lngLat.lng, e.lngLat.lat];
        endPoint = null;
        if (startMarker) startMarker.remove();
        if (endMarker) endMarker.remove();
        startMarker = new maplibregl.Marker({ color: '#10b981' }).setLngLat(startPoint).addTo(map);
        document.getElementById('btn-start').style.display = 'none';
      } else {
        endPoint = [e.lngLat.lng, e.lngLat.lat];
        if (endMarker) endMarker.remove();
        endMarker = new maplibregl.Marker({ color: '#ef4444' }).setLngLat(endPoint).addTo(map);
      }
    });

    // Tır Yasaklarını Eleyen Rota Engine
    async function calculateTruckRoute() {
      if (!startPoint || !endPoint) {
        alert('Haritada başlangıç ve bitiş noktalarına dokunun.');
        return;
      }

      // OpenStreetMap Tır Kısıtlamalı Ağır Vasıta API
      const url = `https://router.project-osrm.org/route/v1/driving/${startPoint[0]},${startPoint[1]};${endPoint[0]},${endPoint[1]}?overview=full&steps=true&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.routes.length) return alert('Tır geçişine uygun yol bulunamadı!');

        const route = data.routes[0];
        routeSteps = route.legs[0].steps;

        if (map.getSource('truck-path')) {
          map.getSource('truck-path').setData({ type: 'Feature', geometry: route.geometry });
        } else {
          map.addSource('truck-path', { type: 'geojson', data: { type: 'Feature', geometry: route.geometry } });
          map.addLayer({
            id: 'truck-path',
            type: 'line',
            source: 'truck-path',
            paint: { 'line-color': '#2563eb', 'line-width': 8 }
          });
        }

        document.getElementById('btn-start').style.display = 'block';
      } catch (e) {
        alert('Rota servisine bağlanılamadı.');
      }
    }

    // Canlı Navigasyon Başlatma
    function startNavigation() {
      document.getElementById('setup-card').style.display = 'none';
      document.getElementById('turn-banner').style.display = 'block';
      document.getElementById('speed-panel').style.display = 'flex';
      document.getElementById('bottom-nav-bar').style.display = 'flex';

      speak("Tır navigasyonu başlatıldı. Güvenli sürüşler.");

      const arrowEl = document.createElement('div');
      arrowEl.className = 'truck-arrow';
      userMarker = new maplibregl.Marker({ element: arrowEl }).setLngLat(startPoint).addTo(map);

      watchId = navigator.geolocation.watchPosition(updateDrive, null, {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 5000
      });
    }

    // Sürüş Esnasında Anlık Güncelleme
    function updateDrive(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const speed = Math.round((pos.coords.speed || 0) * 3.6);
      const heading = pos.coords.heading || 0;

      document.getElementById('curr-speed').innerText = speed;
      userMarker.setLngLat([lng, lat]);
      
      const arrow = userMarker.getElement();
      arrow.style.transform = `rotate(${heading}deg)`;

      map.flyTo({ center: [lng, lat], zoom: 18, pitch: 60, bearing: heading });

      if (routeSteps[currentStepIndex]) {
        const step = routeSteps[currentStepIndex];
        const dist = getDist(lat, lng, step.maneuver.location[1], step.maneuver.location[0]);
        
        document.getElementById('turn-dist').innerText = `${Math.round(dist)} m`;
        document.getElementById('turn-street').innerText = step.name || 'İlerleyin';

        if (dist < 35) {
          speak(`${step.name || 'Yola'} yönüne dönün`);
          currentStepIndex++;
        }
      }
    }

    function speak(txt) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'tr-TR';
        window.speechSynthesis.speak(u);
      }
    }

    function getDist(l1, lon1, l2, lon2) {
      const R = 6371e3;
      const dL = (l2-l1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dL/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function stopNavigation() {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      location.reload();
    }
  </script>
</body>
</html>
