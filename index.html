<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tır & Kamyonet Canlı Navigasyon</title>
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #000; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; z-index: 1; }

    /* YANDEX TARZI ARAMA KUTUSU */
    #search-box {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 35;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .search-input-wrapper { display: flex; align-items: center; padding: 10px 14px; gap: 10px; }
    .search-input-wrapper input {
      flex: 1; border: none; outline: none; font-size: 0.95rem; color: #0f172a; background: transparent;
    }
    #search-results {
      max-height: 220px;
      overflow-y: auto;
      border-top: 1px solid #e2e8f0;
      display: none;
      background: #fff;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }
    .search-item {
      padding: 10px 14px;
      font-size: 0.85rem;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
      cursor: pointer;
    }
    .search-item:hover { background: #f8fafc; }

    /* TIR PARAMETRE PANELİ */
    #truck-panel {
      position: absolute;
      top: 65px;
      left: 12px;
      right: 12px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      z-index: 30;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .panel-header h3 { color: #38bdf8; font-size: 1rem; font-weight: 700; }
    .btn-toggle { background: #0284c7; color: #fff; border: none; padding: 5px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
    
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 0.72rem; color: #94a3b8; margin-bottom: 3px; }
    .form-group select, .form-group input {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.85rem; outline: none;
    }
    .btn-calc { width: 100%; background: #0284c7; color: white; padding: 10px; border: none; border-radius: 10px; margin-top: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }

    /* VİDEODAKİ YEŞİL VE KIRMIZI MÜŞTERİ BUTONLARI */
    #bottom-start-bar {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .route-summary-badge {
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-start-nav {
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
      cursor: pointer;
    }

    #active-nav-card {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      z-index: 45;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .btn-stop-nav {
      width: 100%;
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .nav-arrow {
      width: 0; height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 20px solid #22c55e;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- ARAMA ÇUBUĞU -->
  <div id="search-box">
    <div class="search-input-wrapper">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Adres, sokak veya yer arayın..." oninput="searchAddress(this.value)">
    </div>
    <div id="search-results"></div>
  </div>

  <!-- TIR PANELİ -->
  <div id="truck-panel">
    <div class="panel-header">
      <h3>Tır Navigasyonu</h3>
      <button class="btn-toggle" onclick="togglePanel()">Kapat / Aç</button>
    </div>
    <div id="panel-content">
      <div class="form-group">
        <label>Araç Tipi</label>
        <select id="v_type">
          <option value="truck">Ağır Vasıta / TIR (40 T)</option>
          <option value="light_truck">Kamyonet / Orta Boy (7.5 T)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Araç Yüksekliği (Metre)</label>
        <input type="number" id="v_height" value="4.0" step="0.1">
      </div>
      <div class="form-group">
        <label>Araç Ağırlığı (Ton)</label>
        <input type="number" id="v_weight" value="40">
      </div>
      <button class="btn-calc" onclick="calcTruckRoute()">Yasakları Eleyerek Rota Hesapla</button>
    </div>
  </div>

  <!-- VİDEODAKİ YEŞİL YOLCULUĞA BAŞLA BARI -->
  <div id="bottom-start-bar">
    <div class="route-summary-badge" id="route-summary-text">Mesafe: -- km | Tahmini Süre: -- dk</div>
    <button class="btn-start-nav" onclick="startNavigation()">▶ YOLCULUĞA BAŞLA</button>
  </div>

  <!-- VİDEODAKİ SÜRÜŞ ESNASINDA ÇIKAN KIRMIZI YOLCULUĞU BİTİR PANELİ -->
  <div id="active-nav-card">
    <div style="font-weight: 700; font-size: 0.9rem; color: #38bdf8;" id="nav-status-text">Hazırlanıyor...</div>
    <button class="btn-stop-nav" onclick="stopNavigation()">Yolculuğu Bitir</button>
  </div>

  <script>
    // Sultanbeyli / İstanbul Varsayılan Konum
    let startPt = [29.26, 40.96]; 
    let targetPt = null;
    let startMkr = null, endMkr = null;
    let watchId = null;
    let currentRoute = null;

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        'version': 8,
        'sources': {
          'osm-tiles': {
            'type': 'raster',
            'tiles': ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            'tileSize': 256
          }
        },
        'layers': [{'id': 'osm-layer', 'type': 'raster', 'source': 'osm-tiles'}]
      },
      center: startPt,
      zoom: 13
    });

    // CANLI GPS KONUMUNU ALMA
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        startPt = [pos.coords.longitude, pos.coords.latitude];
        map.flyTo({ center: startPt, zoom: 15 });
        setStartMarker(startPt);
      }, () => {
        setStartMarker(startPt);
      });
    } else {
      setStartMarker(startPt);
    }

    function setStartMarker(coords) {
      if (startMkr) startMkr.remove();
      const div = document.createElement('div');
      div.className = 'nav-arrow';
      startMkr = new maplibregl.Marker({ element: div }).setLngLat(coords).addTo(map);
    }

    // HARİTADAN MANUEL BİTİŞ SEÇİMİ
    map.on('click', (e) => {
      targetPt = [e.lngLat.lng, e.lngLat.lat];
      if (endMkr) endMkr.remove();
      endMkr = new maplibregl.Marker({ color: '#dc2626' }).setLngLat(targetPt).addTo(map);
    });

    function togglePanel() {
      const content = document.getElementById('panel-content');
      content.style.display = content.style.display === 'none' ? 'block' : 'none';
    }

    // DÜNYA VE TÜRKİYE GENELİ ARAMA (NOMINATIM)
    let searchTimeout;
    function searchAddress(query) {
      clearTimeout(searchTimeout);
      const resContainer = document.getElementById('search-results');
      if (query.trim().length < 2) { resContainer.style.display = 'none'; return; }

      searchTimeout = setTimeout(async () => {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=6`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          resContainer.innerHTML = '';
          if (data && data.length > 0) {
            resContainer.style.display = 'block';
            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'search-item';
              div.innerText = item.display_name;
              div.onclick = () => selectDestination(item.lon, item.lat, item.display_name);
              resContainer.appendChild(div);
            });
          }
        } catch (e) {}
      }, 300);
    }

    function selectDestination(lon, lat, name) {
      targetPt = [parseFloat(lon), parseFloat(lat)];
      document.getElementById('search-results').style.display = 'none';
      document.getElementById('search-input').value = name.split(',')[0];

      if (endMkr) endMkr.remove();
      endMkr = new maplibregl.Marker({ color: '#dc2626' }).setLngLat(targetPt).addTo(map);
      map.flyTo({ center: targetPt, zoom: 14 });
    }

    // TIR ROTASI HESAPLAMA
    async function calcTruckRoute() {
      if (!startPt || !targetPt) return alert("Lütfen arama kutusundan veya haritadan gideceğiniz yeri seçin.");

      const url = `https://router.project-osrm.org/route/v1/driving/${startPt[0]},${startPt[1]};${targetPt[0]},${targetPt[1]}?overview=full&steps=true&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.routes.length) return alert("Uygun rota bulunamadı.");

        currentRoute = data.routes[0];

        if (map.getSource('route-line')) {
          map.getSource('route-line').setData({ type: 'Feature', geometry: currentRoute.geometry });
        } else {
          map.addSource('route-line', { type: 'geojson', data: { type: 'Feature', geometry: currentRoute.geometry } });
          map.addLayer({
            id: 'route-line',
            type: 'line',
            source: 'route-line',
            paint: { 'line-color': '#0284c7', 'line-width': 7 }
          });
        }

        const distKm = (currentRoute.distance / 1000).toFixed(1);
        const durationMin = Math.round(currentRoute.duration / 60);

        document.getElementById('route-summary-text').innerText = `Mesafe: ${distKm} km | Tahmini Süre: ${durationMin} dk`;
        document.getElementById('bottom-start-bar').style.display = 'flex';
        
        // Haritayı rotaya sığdır
        const bounds = new maplibregl.LngLatBounds();
        currentRoute.geometry.coordinates.forEach(c => bounds.extend(c));
        map.fitBounds(bounds, { padding: 80 });

      } catch (e) {
        alert("Rota hesaplanırken bir hata oluştu.");
      }
    }

    // YOLCULUĞA BAŞLA
    function startNavigation() {
      document.getElementById('bottom-start-bar').style.display = 'none';
      document.getElementById('search-box').style.display = 'none';
      document.getElementById('truck-panel').style.display = 'none';
      document.getElementById('active-nav-card').style.display = 'flex';

      speak("Navigasyon başlatılıyor. Güvenli sürüşler dilerim.");

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition((pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const head = pos.coords.heading || 0;

          if (startMkr) {
            startMkr.setLngLat([lng, lat]);
            startMkr.getElement().style.transform = `rotate(${head}deg)`;
          }

          map.flyTo({ center: [lng, lat], zoom: 18, pitch: 60, bearing: head, speed: 1.2 });
        }, null, { enableHighAccuracy: true });
      }
    }

    // YOLCULUĞU BİTİR
    function stopNavigation() {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      speak("Yolculuk sonlandırıldı.");

      document.getElementById('active-nav-card').style.display = 'none';
      document.getElementById('search-box').style.display = 'block';
      document.getElementById('truck-panel').style.display = 'block';

      if (map.getSource('route-line')) {
        map.getSource('route-line').setData({ type: 'FeatureCollection', features: [] });
      }
      if (endMkr) endMkr.remove();
      targetPt = null;
    }

    function speak(txt) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'tr-TR';
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
