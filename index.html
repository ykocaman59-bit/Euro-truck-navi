<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tır & Kamyonet Profesyonel Navigasyon Sistemi</title>
  
  <!-- MapLibre GL CSS ve JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar {
      width: 360px;
      background: #1e293b;
      color: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
      box-shadow: 4px 0 15px rgba(0,0,0,0.3);
    }

    h2 { font-size: 1.2rem; color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; }
    
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 0.85rem; color: #94a3b8; }
    input, select, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
    }

    button {
      background: #0284c7;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }

    #info-panel {
      background: #334155;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    #map { flex: 1; height: 100%; }

    .instruction-box {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 0.85rem;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Tır Navigasyon Ayarları</h2>
    
    <div class="form-group">
      <label for="vehicle_type">Araç Tipi</label>
      <select id="vehicle_type" onchange="updateVehicleDefaults()">
        <option value="truck">Ağır Vasıta / TIR (40 T)</option>
        <option value="van">Kamyonet / Hafif Ticari (3.5 T)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="max_height">Araç Yüksekliği (Metre)</label>
      <input type="number" id="max_height" value="4.0" step="0.1" min="1">
    </div>

    <div class="form-group">
      <label for="max_weight">Araç Toplam Ağırlığı (Ton)</label>
      <input type="number" id="max_weight" value="40" step="0.5" min="1">
    </div>

    <button onclick="calculateRoute()">Yasakları Eleyerek Rota Hesapla</button>

    <div id="info-panel">
      <strong>Kullanım:</strong><br>
      • Haritada <u>Sol Tık</u>: Başlangıç Noktası<br>
      • Haritada <u>Sağ Tık</u>: Bitiş Noktası
    </div>

    <div id="route-details" style="display:none;">
      <h3>Rota Özeti</h3>
      <p id="route-distance"></p>
      <p id="route-time"></p>
    </div>
  </div>

  <div class="instruction-box">Tır ve Kamyonet Yasaklı Yollar Otomatik Elenir</div>
  <div id="map"></div>

  <script>
    // MapLibre Harita Kurulumu (Ücretsiz OSM Vektör Tablosu)
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://demotiles.maplibre.org/style.json',
      center: [28.9784, 41.0082], // İstanbul merkezli başlama
      zoom: 10
    });

    let startPoint = null;
    let endPoint = null;
    let startMarker = null;
    let endMarker = null;

    // Araç tipi değiştikçe varsayılan ölçüleri güncelleme
    function updateVehicleDefaults() {
      const type = document.getElementById('vehicle_type').value;
      if (type === 'truck') {
        document.getElementById('max_height').value = "4.0";
        document.getElementById('max_weight').value = "40";
      } else {
        document.getElementById('max_height').value = "2.8";
        document.getElementById('max_weight').value = "3.5";
      }
    }

    // Haritaya tıklayarak başlangıç noktası belirleme (Sol Tık)
    map.on('click', (e) => {
      startPoint = [e.lngLat.lng, e.lngLat.lat];
      if (startMarker) startMarker.remove();
      startMarker = new maplibregl.Marker({ color: '#22c55e' })
        .setLngLat(startPoint)
        .addTo(map);
    });

    // Haritaya tıklayarak bitiş noktası belirleme (Sağ Tık)
    map.on('contextmenu', (e) => {
      endPoint = [e.lngLat.lng, e.lngLat.lat];
      if (endMarker) endMarker.remove();
      endMarker = new maplibregl.Marker({ color: '#ef4444' })
        .setLngLat(endPoint)
        .addTo(map);
    });

    // GraphHopper Backend API'sine İstek Atma
    async function calculateRoute() {
      if (!startPoint || !endPoint) {
        alert('Lütfen haritadan sol tık ile başlangıç, sağ tık ile bitiş noktası seçin.');
        return;
      }

      const profile = document.getElementById('vehicle_type').value;
      const height = document.getElementById('max_height').value;
      const weight = document.getElementById('max_weight').value;

      // Yerel GraphHopper sunucusu API adresi
      const url = `http://localhost:8989/route?` +
        `point=${startPoint[1]},${startPoint[0]}&` +
        `point=${endPoint[1]},${endPoint[0]}&` +
        `profile=${profile}&` +
        `custom_model.max_height=${height}&` +
        `custom_model.max_weight=${weight}&` +
        `type=json&points_encoded=false`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (!data.paths || data.paths.length === 0) {
          alert('Girilen araç ölçülerine uygun yasal bir rota bulunamadı!');
          return;
        }

        const routeData = data.paths[0];
        const coordinates = routeData.points.coordinates;

        // Haritada mevcut rota varsa güncelle, yoksa yeni katman oluştur
        if (map.getSource('truck-route')) {
          map.getSource('truck-route').setData({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: coordinates }
          });
        } else {
          map.addSource('truck-route', {
            type: 'geojson',
            data: {
              type: 'Feature',
              geometry: { type: 'LineString', coordinates: coordinates }
            }
          });

          map.addLayer({
            id: 'truck-route',
            type: 'line',
            source: 'truck-route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#0284c7', 'line-width': 6 }
          });
        }

        // Rota detaylarını panede göster
        document.getElementById('route-details').style.display = 'block';
        document.getElementById('route-distance').innerText = `Mesafe: ${(routeData.distance / 1000).toFixed(1)} km`;
        document.getElementById('route-time').innerText = `Tahmini Süre: ${Math.round(routeData.time / 60000)} dk`;

      } catch (error) {
        console.error('Rota hesaplama hatası:', error);
        alert('GraphHopper sunucusuna bağlanılamadı. Lütfen sunucunun çalıştığından emin olun.');
      }
    }
  </script>
</body>
</html>
