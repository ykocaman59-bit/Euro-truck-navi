<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIRNAV - Tırların Yol Arkadaşı</title>
    <!-- Leaflet Harita Kütüphanesi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-dark: #0b132b;
            --bg-card: #1c2541;
            --accent-blue: #0066ff;
            --accent-green: #2ecc71;
            --accent-red: #ff3333;
            --text-main: #ffffff;
            --text-secondary: #8d99ae;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .app-container { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 70px); display: none; flex-direction: column; background: var(--bg-dark); overflow-y: auto; }
        .screen.active { display: flex; }

        /* Harita Ekranı */
        #map { width: 100%; height: 100%; position: absolute; z-index: 1; }
        
        /* Üst Tır Navigasyon Paneli (Görseldeki Gibi) */
        .top-vehicle-panel {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 1000;
            background: rgba(28, 37, 65, 0.95); padding: 12px; border-radius: 12px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .panel-title { font-size: 15px; font-weight: bold; color: white; }
        .toggle-btn { background: var(--accent-blue); color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        
        .config-body { display: block; margin-top: 8px; }
        .config-body.hidden { display: none; }
        .config-group { margin-bottom: 8px; }
        .config-group label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
        .config-select, .config-input { width: 100%; padding: 8px; background: #0b132b; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: white; font-size: 13px; }

        /* Alt Yolculuk Kontrol Kartı */
        .trip-bottom-card {
            position: absolute; bottom: 20px; left: 15px; right: 15px; z-index: 1000;
            background: rgba(28, 37, 65, 0.95); padding: 15px; border-radius: 14px;
            backdrop-filter: blur(10px); text-align: center; border: 1px solid rgba(255,255,255,0.1); display: none;
        }
        .trip-bottom-card.active { display: block; }
        .trip-text { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 500; }
        
        .btn-start-trip { width: 100%; padding: 12px; background: var(--accent-green); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-end-trip { width: 100%; padding: 12px; background: var(--accent-red); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }

        /* Ana Sayfa Stili */
        .home-header { padding: 30px 20px; text-align: center; background: linear-gradient(180deg, #1c2541 0%, #0b132b 100%); }
        .home-header h1 { font-size: 28px; color: var(--text-main); margin-top: 10px; }
        .form-group { padding: 15px 20px; }
        .form-group label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .form-input { width: 100%; padding: 14px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-size: 16px; }
        .btn-primary { width: calc(100% - 40px); margin: 10px 20px; padding: 16px; background: var(--accent-blue); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }

        /* Uyarı Banner */
        .alert-banner {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 20;
            background: var(--accent-red); padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 20px rgba(255,51,51,0.4);
        }

        /* Alt Menü Çubuğu */
        .bottom-nav {
            height: 70px; background: var(--bg-card); display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05); z-index: 100;
        }
        .nav-item { background: none; border: none; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; font-size: 11px; cursor: pointer; gap: 4px; }
        .nav-item.active { color: var(--accent-blue); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

        /* Genel Ayarlar Listesi */
        .settings-list { padding: 20px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. ANA SAYFA -->
    <div id="screen-home" class="screen active">
        <div class="home-header">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="#0066ff"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.62H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <h1>TIRNAV</h1>
            <p style="color: var(--text-secondary); font-size: 13px;">Tırların Yol Arkadaşı</p>
        </div>
        <div class="form-group">
            <label>Mevcut Konum</label>
            <input type="text" class="form-input" id="start-loc" value="Sultanbeyli / İstanbul">
        </div>
        <div class="form-group">
            <label>Varış Noktası</label>
            <input type="text" class="form-input" id="end-loc" placeholder="Adres, şehir veya ülke girin">
        </div>
        <button class="btn-primary" onclick="calculateRoute()">Rota Oluştur</button>
    </div>

    <!-- 2. HARİTA & NAVİGASYON EKRANI -->
    <div id="screen-map" class="screen">
        <!-- İstediğin Üst Araç Seçim Paneli -->
        <div class="top-vehicle-panel">
            <div class="panel-header">
                <span class="panel-title">Tır Navigasyonu</span>
                <button class="toggle-btn" onclick="togglePanel()">Kapat / Aç</button>
            </div>
            <div class="config-body" id="vehicleConfigPanel">
                <div class="config-group">
                    <label>Araç Tipi</label>
                    <select class="config-select" id="vehicleType" onchange="handleVehicleChange()">
                        <option value="heavy">Ağır Vasıta / TIR (40 T)</option>
                        <option value="kamyonet">Kamyonet</option>
                        <option value="car">Otomobil</option>
                    </select>
                </div>
                <div class="config-group" id="heightGroup">
                    <label>Araç Yüksekliği (Metre)</label>
                    <input type="number" class="config-input" id="vehicleHeight" value="4.20" step="0.1">
                </div>
                <div class="config-group" id="weightGroup">
                    <label>Araç Ağırlığı (Ton)</label>
                    <input type="number" class="config-input" id="vehicleWeight" value="40">
                </div>
                <button class="btn-primary" style="width: 100%; margin: 5px 0 0 0; padding: 10px; font-size: 14px;" onclick="calculateRoute()">Yasakları Eleyerek Rota Hesapla</button>
            </div>
        </div>

        <div id="map"></div>

        <!-- Alt Yolculuk Başlat / Bitir Kartı -->
        <div class="trip-bottom-card" id="tripCard">
            <div class="trip-text" id="tripInfoText">Mesafe: 482 km | Tahmini Süre: 5 sa 42 dk</div>
            <button class="btn-start-trip" id="tripActionBtn" onclick="toggleTripState()">YOLCULUĞA BAŞLA</button>
        </div>
    </div>

    <!-- 3. UYARI EKRANI (Köprü / Sınırlama) -->
    <div id="screen-alert" class="screen" style="background: rgba(11, 19, 43, 0.95); padding: 20px; justify-content: center;">
        <div class="alert-banner" style="position: relative; margin-bottom: 20px;">
            <div>
                <h3 style="font-size: 18px; margin-bottom: 5px;">DİKKAT!</h3>
                <p style="font-size: 14px;">4.00 m aracınız için yüksek! 3.80 m köprü var.</p>
            </div>
        </div>
        <button class="btn-primary" onclick="switchScreen('screen-map')">Tamam</button>
    </div>

    <!-- 7. AYARLAR -->
    <div id="screen-settings" class="screen">
        <div style="padding: 20px; font-size: 20px; font-weight: bold;">Ayarlar</div>
        <div class="settings-list">
            <div class="setting-item"><span>Navigasyon Sesleri</span><input type="checkbox" checked></div>
            <div class="setting-item"><span>Harita Görünümü</span><span style="color: var(--text-secondary);">Uydu ></span></div>
            <div class="setting-item"><span>Birimler</span><span style="color: var(--text-secondary);">Kilometre ></span></div>
        </div>
    </div>

    <!-- ALT NAVİGASYON ÇUBUĞU -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchScreen('screen-home')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Ana Sayfa
        </button>
        <button class="nav-item" onclick="switchScreen('screen-map')">
            <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.1V5l6 2.1V19z"/></svg>
            Harita
        </button>
        <button class="nav-item" onclick="switchScreen('screen-alert')">
            <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
            Uyarılar
        </button>
        <button class="nav-item" onclick="switchScreen('screen-settings')">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.47l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.47l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            Ayarlar
        </button>
    </div>
</div>

<script>
    const apiKey = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImYzMTU3MGQ5YWU1NDQzYzRiYjBmZWNiYWYwNzAyZWZjIiwiaCI6Im11cm11cjY0In0=";
    let map, routeLayer;
    let tripStarted = false;

    // Sesli Asistan Fonksiyonu
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        
        if(screenId === 'screen-home') document.querySelectorAll('.nav-item')[0].classList.add('active');
        if(screenId === 'screen-map') {
            document.querySelectorAll('.nav-item')[1].classList.add('active');
            setTimeout(() => { if(map) map.invalidateSize(); }, 200);
        }
        if(screenId === 'screen-alert') document.querySelectorAll('.nav-item')[2].classList.add('active');
        if(screenId === 'screen-settings') document.querySelectorAll('.nav-item')[3].classList.add('active');
    }

    function initMap() {
        map = L.map('map', {zoomControl: false}).setView([40.9631, 29.2662], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
    }

    function togglePanel() {
        const panel = document.getElementById('vehicleConfigPanel');
        panel.classList.toggle('hidden');
    }

    function handleVehicleChange() {
        const type = document.getElementById('vehicleType').value;
        const heightGroup = document.getElementById('heightGroup');
        const weightGroup = document.getElementById('weightGroup');
        
        if(type === 'car') {
            heightGroup.style.display = 'none';
            weightGroup.style.display = 'none';
        } else {
            heightGroup.style.display = 'block';
            weightGroup.style.display = 'block';
        }
    }

    function calculateRoute() {
        switchScreen('screen-map');
        togglePanel(); // Hesaplama yapılınca paneli kapatıp haritayı göster

        const startCoord = [29.2662, 40.9631]; // Sultanbeyli
        const endCoord = [32.8597, 39.9334];   // Ankara Örnek
        
        const vehicleType = document.getElementById('vehicleType').value;
        const profile = vehicleType === 'heavy' ? 'driving-heavy' : 'driving-car';

        fetch(`https://api.openrouteservice.org/v2/directions/${profile}?api_key=${apiKey}&start=${startCoord.join(',')}&end=${endCoord.join(',')}`)
        .then(response => response.json())
        .then(data => {
            if(data.features && data.features.length > 0) {
                const coords = data.features[0].geometry.coordinates.map(c => [c[1], c[0]]);
                const summary = data.features[0].properties.summary;
                const km = (summary.distance / 1000).toFixed(1);
                const mins = Math.round(summary.duration / 60);

                if(routeLayer) map.removeLayer(routeLayer);
                routeLayer = L.polyline(coords, {color: '#0066ff', weight: 6}).addTo(map);
                map.fitBounds(routeLayer.getBounds());

                // Rota oluştu, alt yolculuk kartını göster
                document.getElementById('tripInfoText').innerText = `Mesafe: ${km} km | Tahmini Süre: ${mins} dk`;
                document.getElementById('tripCard').classList.add('active');
                tripStarted = false;
                const btn = document.getElementById('tripActionBtn');
                btn.innerText = "YOLCULUĞA BAŞLA";
                btn.className = "btn-start-trip";
            }
        })
        .catch(err => console.log("Rota çekilemedi.", err));
    }

    function toggleTripState() {
        if(!tripStarted) {
            // Yolculuk Başlat
            tripStarted = true;
            speak("Navigasyon başlatılıyor. Güvenli sürüşler dilerim, TruckNav'ı seçtiğiniz için teşekkür ederim.");
            const btn = document.getElementById('tripActionBtn');
            btn.innerText = "YOLCULUĞU BİTİR";
            btn.className = "btn-end-trip";
        } else {
            // Yolculuğu Bitir
            speak("Yolculuk sonlandırılıyor.");
            setTimeout(() => {
                document.getElementById('tripCard').classList.remove('active');
                if(routeLayer) map.removeLayer(routeLayer);
                tripStarted = false;
            }, 1200);
        }
    }

    window.onload = initMap;
</script>
</body>
</html>
