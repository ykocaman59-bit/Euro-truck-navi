<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yandex Altyapılı Tır Navigasyonu</title>
  
  <script src="https://api-maps.yandex.ru/2.1/?lang=tr_TR&coordorder=longlat&apikey=YOUR_API_KEY" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #000; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; z-index: 1; }

    /* YANDEX TARZI ARAMA KUTUSU */
    #search-box {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 35;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .search-input-wrapper { display: flex; align-items: center; padding: 12px 14px; gap: 10px; }
    .search-input-wrapper input {
      flex: 1; border: none; outline: none; font-size: 0.95rem; color: #0f172a; background: transparent;
    }

    /* TIR NAVİGASYON PANELİ (GÖRÜNÜM KORUNDU) */
    #truck-panel {
      position: absolute;
      top: 68px;
      left: 12px;
      right: 12px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      z-index: 30;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .panel-header h3 { color: #38bdf8; font-size: 1rem; font-weight: 700; }
    .btn-toggle { background: #0284c7; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
    
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 0.72rem; color: #94a3b8; margin-bottom: 3px; }
    .form-group select, .form-group input {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.85rem; outline: none;
    }
    .btn-calc { width: 100%; background: #0284c7; color: white; padding: 12px; border: none; border-radius: 10px; margin-top: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }

    /* VİDEODAKİ YEŞİL BARI KORU */
    #bottom-start-bar {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .route-summary-badge {
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-start-nav {
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
      cursor: pointer;
    }

    /* SÜRÜŞ ESNASINDA TARİF VE BİTİR PANELİ */
    #active-nav-card {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      z-index: 45;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .instruction-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
    }
    .btn-stop-nav {
      width: 100%;
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="search-box">
    <div class="search-input-wrapper">
      <span>🔍</span>
      <input type="text" id="suggest-input" placeholder="Yandex ile ev adresi, sokak veya ilçe arayın...">
    </div>
  </div>

  <div id="truck-panel">
    <div class="panel-header">
      <h3>Tır Navigasyonu</h3>
      <button class="btn-toggle" onclick="togglePanel()">Kapat / Aç</button>
    </div>
    <div id="panel-content">
      <div class="form-group">
        <label>Araç Tipi</label>
        <select id="v_type">
          <option value="truck">Ağır Vasıta / TIR (40 T)</option>
          <option value="light_truck">Kamyonet / Orta Boy (7.5 T)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Araç Yüksekliği (Metre)</label>
        <input type="number" id="v_height" value="4.20" step="0.1">
      </div>
      <div class="form-group">
        <label>Araç Ağırlığı (Ton)</label>
        <input type="number" id="v_weight" value="40">
      </div>
      <button class="btn-calc" onclick="calcYandexRoute()">Yasakları Eleyerek Rota Hesapla</button>
    </div>
  </div>

  <div id="bottom-start-bar">
    <div class="route-summary-badge" id="route-summary-text">Mesafe: -- km | Tahmini Süre: -- dk</div>
    <button class="btn-start-nav" onclick="startNavigation()">▶ YOLCULUĞA BAŞLA</button>
  </div>

  <div id="active-nav-card">
    <div class="instruction-text" id="nav-instruction">Hazırlanıyor...</div>
    <button class="btn-stop-nav" onclick="stopNavigation()">Yolculuğu Bitir</button>
  </div>

  <script>
    let myMap, multiRoute;
    let startCoords = [29.26, 40.96]; // Varsayılan Sultanbeyli
    let targetCoords = null;
    let watchId = null;
    let routeSteps = [];
    let lastSpokenIndex = -1;

    ymaps.ready(init);

    function init() {
      // Yandex Haritayı Başlat
      myMap = new ymaps.Map('map', {
        center: startCoords,
        zoom: 13,
        controls: ['zoomControl', 'geolocationControl']
      });

      // CANLI GPS KONUMU AL
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          startCoords = [pos.coords.longitude, pos.coords.latitude];
          myMap.setCenter(startCoords, 15);
        });
      }

      // YANDEX OTO-TAMAMLAMA ADRES ARAMA SERVISI
      const suggestView = new ymaps.SuggestView('suggest-input');
      suggestView.events.add('select', function (e) {
        const address = e.get('item').value;
        ymaps.geocode(address).then(function (res) {
          const firstGeoObject = res.geoObjects.get(0);
          targetCoords = firstGeoObject.geometry.getCoordinates();
          
          myMap.setCenter(targetCoords, 14);
        });
      });

      // HARİTADAN MANUEL BİTİŞ SEÇME
      myMap.events.add('click', function (e) {
        targetCoords = e.get('coords');
      });
    }

    function togglePanel() {
      const content = document.getElementById('panel-content');
      content.style.display = content.style.display === 'none' ? 'block' : 'none';
    }

    // YANDEX ROTA HESAPLAMA MOTORU
    function calcYandexRoute() {
      if (!targetCoords) {
        alert("Lütfen arama kutusundan adresinizi yazın veya haritadan hedef seçin.");
        return;
      }

      if (multiRoute) myMap.geoObjects.remove(multiRoute);

      // Yandex MultiRoute Kullanımı
      multiRoute = new ymaps.multiRouter.MultiRoute({
        referencePoints: [startCoords, targetCoords],
        params: {
          routingMode: 'truck' // Tır Rotalama Modu
        }
      }, {
        boundsAutoApply: true,
        routeActiveStrokeWidth: 7,
        routeActiveStrokeColor: "#0284c7"
      });

      myMap.geoObjects.add(multiRoute);

      // Rota bilgisi hazır olduğunda mesafe ve tarifleri al
      multiRoute.model.events.add('requestsuccess', function () {
        const activeRoute = multiRoute.getActiveRoute();
        if (activeRoute) {
          const distance = activeRoute.properties.get("distance").text;
          const duration = activeRoute.properties.get("duration").text;

          document.getElementById('route-summary-text').innerText = `Mesafe: ${distance} | Tahmini Süre: ${duration}`;
          document.getElementById('bottom-start-bar').style.display = 'flex';

          // Yön tarif adımlarını diziye kaydet
          routeSteps = [];
          const paths = activeRoute.getPaths();
          paths.each(function (path) {
            const segments = path.getSegments();
            segments.each(function (segment) {
              routeSteps.push({
                text: segment.getProperties().get("action"), // Örn: "Sağa dönün", "Düz devam edin"
                coordinates: segment.getCoordinates()[0],
                distance: segment.getLength()
              });
            });
          });
        }
      });
    }

    // YOLCULUĞA BAŞLA VE CANLI SESLİ TARİF ET
    function startNavigation() {
      document.getElementById('bottom-start-bar').style.display = 'none';
      document.getElementById('search-box').style.display = 'none';
      document.getElementById('truck-panel').style.display = 'none';
      document.getElementById('active-nav-card').style.display = 'flex';

      speak("Navigasyon başlatılıyor. Güvenli sürüşler dilerim.");

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition((pos) => {
          const userLat = pos.coords.latitude;
          const userLng = pos.coords.longitude;
          const userCoords = [userLng, userLat];

          // Haritada kullanıcıyı ortala ve 3D açı ver
          myMap.setCenter(userCoords, 18, { checkZoomRange: true });

          // YAKINLAŞILAN ADIMA GÖRE SESLİ TARİF VER
          checkAndAnnounceInstruction(userCoords);

        }, null, { enableHighAccuracy: true });
      }
    }

    // CANLI TARİF KONTROLÜ
    function checkAndAnnounceInstruction(userCoords) {
      for (let i = 0; i < routeSteps.length; i++) {
        const step = routeSteps[i];
        const dist = getDistanceInMeters(userCoords, step.coordinates);

        // 100 metreden az kaldıysa ve daha önce söylenmediyse tarif et
        if (dist < 100 && i > lastSpokenIndex) {
          const actionText = step.text || "Yola devam edin.";
          document.getElementById('nav-instruction').innerText = actionText;
          speak(actionText);
          lastSpokenIndex = i;
          break;
        }
      }
    }

    // YOLCULUĞU BİTİR
    function stopNavigation() {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      speak("Yolculuk sonlandırıldı.");

      document.getElementById('active-nav-card').style.display = 'none';
      document.getElementById('search-box').style.display = 'block';
      document.getElementById('truck-panel').style.display = 'block';

      if (multiRoute) myMap.geoObjects.remove(multiRoute);
    }

    // TÜRKÇE SESLENDİRME
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'tr-TR';
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    // İKİ KOORDİNAT ARASI MESAFE HESAPLAMA (Metre)
    function getDistanceInMeters(coord1, coord2) {
      const R = 6371e3;
      const rad = Math.PI / 180;
      const dLat = (coord2[1] - coord1[1]) * rad;
      const dLon = (coord2[0] - coord1[0]) * rad;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(coord1[1] * rad) * Math.cos(coord2[1] * rad) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
  </script>
</body>
</html>
