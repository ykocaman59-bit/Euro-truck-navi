name: Build TIRNAV APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Android Tools
        run: |
          npm install -g cordova

      - name: Create Cordova Project structure
        run: |
          cordova create myApp com.tirnav.app TIRNAV
          cp index.html myApp/www/index.html
          cd myApp
          cordova platform add android

      - name: Build Android APK via Cordova
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIRNAV-Debug-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
